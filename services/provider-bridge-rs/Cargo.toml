[package]
name = "capital-ai-provider-bridge"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.99.0"
license = "MIT"
publish = false

[dependencies]
async-nats = "=0.50.0"
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
