    license-and-rights-matrix: "POINT_4_AUDIO_MODELS_REMOVED_FAIL_CLOSED"
    third-party-notices: "MATERIALIZED"
    social-engine-completion-gate: "BLOCKED_POINT4_PROVIDER_DISABLED"
    publishing-distribution-code-cutover: "IMPLEMENTED_DISABLED_PENDING_CI"
    finance-scoring-follow-up: "BLOCKED_BY_SOCIAL_MEDIA_ENGINE_MIGRATION"
    remainingGates: "OPEN"
  required:
