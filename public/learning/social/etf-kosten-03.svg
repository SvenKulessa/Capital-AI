<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>CAPITAL-AI Finanzbildung 3: Checkliste vor dem ETF-Kauf</title><desc>Synthetisches ETF-Kosten-Lernbeispiel. Keine Anlageempfehlung.</desc><rect width="1080" height="1350" fill="#090f21"/><circle cx="990" cy="110" r="305" fill="#18283c"/><rect x="55" y="55" width="970" height="1238" rx="36" fill="none" stroke="#47556d" stroke-width="2"/><text x="95" y="145" font-family="Arial,DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#f6c765">CAPITAL-AI</text><text x="95" y="196" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="600" fill="#8fd6ea">FINANZWISSEN</text><text x="890" y="145" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="500" fill="#8fd6ea">3/3</text><text x="95" y="350" font-family="Arial,DejaVu Sans,sans-serif" font-size="71" font-weight="700" fill="#ffffff">Vor dem ETF-Kauf</text><text x="95" y="430" font-family="Arial,DejaVu Sans,sans-serif" font-size="68" font-weight="700" fill="#f6c765">diese 4 Punkte pruefen</text><rect x="95" y="516" width="890" height="133" rx="24" fill="#192b42" stroke="#4e657d"/><circle cx="153" cy="581" r="27" fill="#275566"/><path d="M137 583 l12 9 l20 -25" fill="none" stroke="#9de9dc" stroke-width="6"/><text x="218" y="571" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#ffffff">Orderkosten</text><text x="218" y="617" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" fill="#c9d9e8">Was berechnet dein Broker?</text><rect x="95" y="664" width="890" height="133" rx="24" fill="#192b42" stroke="#4e657d"/><circle cx="153" cy="729" r="27" fill="#275566"/><path d="M137 731 l12 9 l20 -25" fill="none" stroke="#9de9dc" stroke-width="6"/><text x="218" y="719" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#ffffff">Spread</text><text x="218" y="765" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" fill="#c9d9e8">Wie weit liegen die Kurse auseinander?</text><rect x="95" y="812" width="890" height="133" rx="24" fill="#192b42" stroke="#4e657d"/><circle cx="153" cy="877" r="27" fill="#275566"/><path d="M137 879 l12 9 l20 -25" fill="none" stroke="#9de9dc" stroke-width="6"/><text x="218" y="867" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#ffffff">Fondskosten</text><text x="218" y="913" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" fill="#c9d9e8">TER ist nicht die Ordergebuehr.</text><rect x="95" y="960" width="890" height="133" rx="24" fill="#192b42" stroke="#4e657d"/><circle cx="153" cy="1025" r="27" fill="#275566"/><path d="M137 1027 l12 9 l20 -25" fill="none" stroke="#9de9dc" stroke-width="6"/><text x="218" y="1015" font-family="Arial,DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#ffffff">Anlagerisiko</text><text x="218" y="1061" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="400" fill="#c9d9e8">Verluste und Zeithorizont beachten.</text><text x="95" y="1150" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="500" fill="#9dd7e7">Allgemeine Bildung, keine Anlageberatung</text><path d="M95 1194 H985" stroke="#596b82" stroke-width="2"/><text x="95" y="1246" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="600" fill="#ccdbea">capital-ai.online/learning</text><text x="754" y="1246" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a9bdcb">LERNBEISPIEL</text></svg>
