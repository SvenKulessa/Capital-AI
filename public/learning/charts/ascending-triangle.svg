<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Aufsteigendes Dreieck. Mehrere Hochs liegen auf ähnlicher Höhe, während die Tiefs ansteigen. Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung" class="h-auto w-full rounded-xl"><title>Aufsteigendes Dreieck · synthetisches Lernbeispiel</title><desc>Mehrere Hochs liegen auf ähnlicher Höhe, während die Tiefs ansteigen. Ein Schlusskurs über dem Widerstand und ein möglicher Retest stützen die Ausbruchsthese. Ein Bruch der steigenden Unterstützung oder Rückfall unter den Widerstand kann das Muster entkräften.</desc><rect width="1200" height="675" rx="24" fill="#080d1c"></rect><g font-family="system-ui, sans-serif"><text x="60" y="48" fill="#fcd34d" font-size="22">CAPITAL-AI · CHART-LERNATLAS</text><text x="60" y="96" fill="#f1f5f9" font-size="34" font-weight="700">Aufsteigendes Dreieck</text><text x="60" y="134" fill="#cbd5e1" font-size="21">Relative Preisposition</text><g><line x1="115" x2="1075" y1="480" y2="480" stroke="#334155"></line><text x="95" y="487" text-anchor="end" fill="#cbd5e1" font-size="20">0</text></g><g><line x1="115" x2="1075" y1="405" y2="405" stroke="#334155"></line><text x="95" y="412" text-anchor="end" fill="#cbd5e1" font-size="20">25</text></g><g><line x1="115" x2="1075" y1="330" y2="330" stroke="#334155"></line><text x="95" y="337" text-anchor="end" fill="#cbd5e1" font-size="20">50</text></g><g><line x1="115" x2="1075" y1="255" y2="255" stroke="#334155"></line><text x="95" y="262" text-anchor="end" fill="#cbd5e1" font-size="20">75</text></g><g><line x1="115" x2="1075" y1="180" y2="180" stroke="#334155"></line><text x="95" y="187" text-anchor="end" fill="#cbd5e1" font-size="20">100</text></g><g><line x1="195" y1="276" x2="915" y2="276" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="8 6"></line><text x="60" y="565" fill="#ddd6fe" font-size="22">1. Widerstand</text></g><g><line x1="115" y1="405" x2="915" y2="288" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="8 6"></line><text x="480" y="565" fill="#ddd6fe" font-size="22">2. Höhere Tiefs</text></g><g><polyline points="115,405 195,276 275,384 355,276 435,360 515,276 595,336 675,276 755,312 835,276 915,288 995,240 1075,213" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></polyline><line x1="60" x2="95" y1="522" y2="522" stroke="#67e8f9" stroke-width="4"></line><text x="110" y="530" fill="#67e8f9" font-size="22">Preis</text></g><text x="1075" y="520" text-anchor="end" fill="#cbd5e1" font-size="20">Zeit →</text><text x="60" y="617" fill="#e2e8f0" font-size="20">Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung</text><text x="60" y="650" fill="#94a3b8" font-size="19">Schematische Geometrie · keine berechneten Signale · capital-ai.online/learning</text></g></svg>
