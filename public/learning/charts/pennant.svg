<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Wimpel / Pennant. Nach einem Impuls laufen obere und untere Begrenzung der kurzen Konsolidierung zusammen. Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung" class="h-auto w-full rounded-xl"><title>Wimpel / Pennant · synthetisches Lernbeispiel</title><desc>Nach einem Impuls laufen obere und untere Begrenzung der kurzen Konsolidierung zusammen. Erst der Ausbruch und dessen Fortbestand zeigen eine mögliche Auflösung; beide Richtungen beobachten. Ein Fehlausbruch oder eine lange, unscharfe Seitwärtsphase passt nicht zum kurzen Wimpel.</desc><rect width="1200" height="675" rx="24" fill="#080d1c"></rect><g font-family="system-ui, sans-serif"><text x="60" y="48" fill="#fcd34d" font-size="22">CAPITAL-AI · CHART-LERNATLAS</text><text x="60" y="96" fill="#f1f5f9" font-size="34" font-weight="700">Wimpel / Pennant</text><text x="60" y="134" fill="#cbd5e1" font-size="21">Relative Preisposition</text><g><line x1="115" x2="1075" y1="480" y2="480" stroke="#334155"></line><text x="95" y="487" text-anchor="end" fill="#cbd5e1" font-size="20">0</text></g><g><line x1="115" x2="1075" y1="405" y2="405" stroke="#334155"></line><text x="95" y="412" text-anchor="end" fill="#cbd5e1" font-size="20">25</text></g><g><line x1="115" x2="1075" y1="330" y2="330" stroke="#334155"></line><text x="95" y="337" text-anchor="end" fill="#cbd5e1" font-size="20">50</text></g><g><line x1="115" x2="1075" y1="255" y2="255" stroke="#334155"></line><text x="95" y="262" text-anchor="end" fill="#cbd5e1" font-size="20">75</text></g><g><line x1="115" x2="1075" y1="180" y2="180" stroke="#334155"></line><text x="95" y="187" text-anchor="end" fill="#cbd5e1" font-size="20">100</text></g><g><line x1="355" y1="240" x2="915" y2="300" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="8 6"></line><text x="60" y="565" fill="#ddd6fe" font-size="22">1. Fallende Hochs</text></g><g><line x1="435" y1="345" x2="915" y2="303" s