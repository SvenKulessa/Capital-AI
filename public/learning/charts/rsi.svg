<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="RSI: Momentum lesen. Der RSI bewegt sich zwischen 0 und 100. 70 und 30 sind verbreitete Beobachtungsmarken, keine universellen Handelsregeln. Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung" class="h-auto w-full rounded-xl"><title>RSI: Momentum lesen · synthetisches Lernbeispiel</title><desc>Der RSI bewegt sich zwischen 0 und 100. 70 und 30 sind verbreitete Beobachtungsmarken, keine universellen Handelsregeln. Rückkehr aus Extrembereichen und den Preis-/Trendkontext gemeinsam betrachten. In starken Trends kann RSI lange extrem bleiben. Ein Extremwert allein bestätigt keine Umkehr.</desc><rect width="1200" height="675" rx="24" fill="#080d1c"></rect><g font-family="system-ui, sans-serif"><text x="60" y="48" fill="#fcd34d" font-size="22">CAPITAL-AI · CHART-LERNATLAS</text><text x="60" y="96" fill="#f1f5f9" font-size="34" font-weight="700">RSI: Momentum lesen</text><text x="60" y="134" fill="#cbd5e1" font-size="21">RSI · schematisch (0–100)</text><g><line x1="115" x2="1075" y1="480" y2="480" stroke="#334155"></line><text x="95" y="487" text-anchor="end" fill="#cbd5e1" font-size="20">0</text></g><g><line x1="115" x2="1075" y1="405" y2="405" stroke="#334155"></line><text x="95" y="412" text-anchor="end" fill="#cbd5e1" font-size="20">25</text></g><g><line x1="115" x2="1075" y1="330" y2="330" stroke="#334155"></line><text x="95" y="337" text-anchor="end" fill="#cbd5e1" font-size="20">50</text></g><g><line x1="115" x2="1075" y1="255" y2="255" stroke="#334155"></line><text x="95" y="262" text-anchor="end" fill="#cbd5e1" font-size="20">75</text></g><g><line x1="115" x2="1075" y1="180" y2="180" stroke="#334155"></line><text x="95" y="187" text-anchor="end" fill="#cbd5e1" font-size="20">100</text></g><g><line x1="115" y1="270" x2="1075" y2="270" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="8 6"></line><text x="60" y="565" fill="#ddd6fe" font-size="22">1. 70</text></g><g><line x1="115" y1="390" x2="1075" y2="390" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="8 6"></line><text x="480" y="565" fill="#ddd6fe" font-size="22">2. 30</text></g><g><polyline points="115,354 195,333 275,309 355,282 435,255 515,236.99999999999997 595,252 675,276 755,318 835,366 915,402 995,384 1075,348" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></polyline><line x1="60" x2="95" y1="522" y2="522" stroke="#67e8f9" stroke-width="4"></line><text x="110" y="530" fill="#67e8f9" font-size="22">RSI</text></g><text x="1075" y="520" text-anchor="end" fill="#cbd5e1" font-size="20">Zeit →</text><text x="60" y="617" fill="#e2e8f0" font-size="20">Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung</text><text x="60" y="650" fill="#94a3b8" font-size="19">Schematische Geometrie · keine berechneten Signale · capital-ai.online/learning</text></g></svg>
