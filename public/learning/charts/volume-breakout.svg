<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Volumen &amp; Ausbruch. Die Aktivität am Ausbruch mit vorherigen Perioden desselben Markts, derselben Quelle und Zeitebene vergleichen. Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung" class="h-auto w-full rounded-xl"><title>Volumen &amp; Ausbruch · synthetisches Lernbeispiel</title><desc>Die Aktivität am Ausbruch mit vorherigen Perioden desselben Markts, derselben Quelle und Zeitebene vergleichen. Erhöhtes Volumen und Fortbestand des Preisausbruchs können sich ergänzen; dieses Bild zeigt nur das Volumenkonzept. Hohes Volumen kann auch am Ende einer Bewegung auftreten. Lücken und venue-spezifische Abdeckung prüfen.</desc><rect width="1200" height="675" rx="24" fill="#080d1c"></rect><g font-family="system-ui, sans-serif"><text x="60" y="48" fill="#fcd34d" font-size="22">CAPITAL-AI · CHART-LERNATLAS</text><text x="60" y="96" fill="#f1f5f9" font-size="34" font-weight="700">Volumen &amp; Ausbruch</text><text x="60" y="134" fill="#cbd5e1" font-size="21">Relatives Volumen · schematisch</text><g><line x1="115" x2="1075" y1="480" y2="480" stroke="#334155"></line><text x="95" y="487" text-anchor="end" fill="#cbd5e1" font-size="20">0</text></g><g><line x1="115" x2="1075" y1="405" y2="405" stroke="#334155"></line><text x="95" y="412" text-anchor="end" fill="#cbd5e1" font-size="20">25</text></g><g><line x1="115" x2="1075" y1="330" y2="330" stroke="#334155"></line><text x="95" y="337" text-anchor="end" fill="#cbd5e1" font-size="20">50</text></g><g><line x1="115" x2="1075" y1="255" y2="255" stroke="#334155"></line><text x="95" y="262" text-anchor="end" fill="#cbd5e1" font-size="20">75</text></g><g><line x1="115" x2="1075" y1="180" y2="180" stroke="#334155"></line><text x="95" y="187" text-anchor="end" fill="#cbd5e1" font-size="20">100</text></g><g><line x1="115" y1="390" x2="1075" y2="390" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="8 6"></line><text x="60" y="565" fill="#ddd6fe" font-size="22">1. Vergleichsniveau</text></g><g><polyline points="115,405 195,396 275,408 355,387 435,393 515,402 595,384 675,396 755,375 835,246 915,216 995,288 1075,324" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></polyline><line x1="60" x2="95" y1="522" y2="522" stroke="#67e8f9" stroke-width="4"></line><text x="110" y="530" fill="#67e8f9" font-size="22">Volumen</text></g><text x="1075" y="520" text-anchor="end" fill="#cbd5e1" font-size="20">Zeit →</text><text x="60" y="617" fill="#e2e8f0" font-size="20">Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung</text><text x="60" y="650" fill="#94a3b8" font-size="19">Schematische Geometrie · keine berechneten Signale · capital-ai.online/learning</text></g></svg>
