<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Keltner-Kanal. Ein Keltner-Kanal verwendet typischerweise einen EMA als Mitte und einen ATR-basierten Abstand. Perioden und Multiplikator müssen angegeben werden. Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung" class="h-auto w-full rounded-xl"><title>Keltner-Kanal · synthetisches Lernbeispiel</title><desc>Ein Keltner-Kanal verwendet typischerweise einen EMA als Mitte und einen ATR-basierten Abstand. Perioden und Multiplikator müssen angegeben werden. Die Indikatorbeobachtung mit Preisstruktur, Fensterlänge, Markt und Datenabdeckung vergleichen. Fehlsignale, Datenlücken und veränderte Marktphasen können die Interpretation schwächen; aus dieser Illustration folgt keine Prognose.</desc><rect width="1200" height="675" rx="24" fill="#080d1c"></rect><g font-family="system-ui, sans-serif"><text x="60" y="48" fill="#fcd34d" font-size="22">CAPITAL-AI · CHART-LERNATLAS</text><text x="60" y="96" fill="#f1f5f9" font-size="34" font-weight="700">Keltner-Kanal</text><text x="60" y="134" fill="#cbd5e1" font-size="21">Keltner-Kanal · schematisch</text><g><line x1="115" x2="1075" y1="480" y2="480" stroke="#334155"></line><text x="95" y="487" text-anchor="end" fill="#cbd5e1" font-size="20">0</text></g><g><line x1="115" x2="1075" y1="405" y2="405" stroke="#334155"></line><text x="95" y="412" text-anchor="end" fill="#cbd5e1" font-size="20">25</text></g><g><line x1="115" x2="1075" y1="330" y2="330" stroke="#334155"></line><text x="95" y="337" text-anchor="end" fill="#cbd5e1" font-size="20">50</text></g><g><line x1="115" x2="1075" y1="255" y2="255" stroke="#334155"></line><text x="95" y="262" text-anchor="end" fill="#cbd5e1" font-size="20">75</text></g><g><line x1="115" x2="1075" y1="180" y2="180" stroke="#334155"></line><text x="95" y="187" text-anchor="end" fill="#cbd5e1" font-size="20">100</text></g><g><polyline points="115,285 195,282 275,276 355,264 435,246 515,234.000000000000