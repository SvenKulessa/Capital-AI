<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="MACD &amp; Signallinie. Die MACD-Linie ist die Differenz zweier EMAs; die Signallinie glättet sie. Üblich sind 12/26/9 Perioden. Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung" class="h-auto w-full rounded-xl"><title>MACD &amp; Signallinie · synthetisches Lernbeispiel</title><desc>Die MACD-Linie ist die Differenz zweier EMAs; die Signallinie glättet sie. Üblich sind 12/26/9 Perioden. Kreuzungen im Trendkontext beobachten. Die Nulllinie kennzeichnet die relative Lage der beiden Preis-EMAs. Seitwärtsmärkte können viele wechselnde Kreuzungen erzeugen. Verzögerung und Fehlsignale mitbewerten.</desc><rect width="1200" height="675" rx="24" fill="#080d1c"></rect><g font-family="system-ui, sans-serif"><text x="60" y="48" fill="#fcd34d" font-size="22">CAPITAL-AI · CHART-LERNATLAS</text><text x="60" y="96" fill="#f1f5f9" font-size="34" font-weight="700">MACD &amp; Signallinie</text><text x="60" y="134" fill="#cbd5e1" font-size="21">MACD · schematische Einheiten</text><g><line x1="115" x2="1075" y1="480" y2="480" stroke="#334155"></line><text x="95" y="487" text-anchor="end" fill="#cbd5e1" font-size="20">-6</text></g><g><line x1="115" x2="1075" y1="405" y2="405" stroke="#334155"></line><text x="95" y="412" text-anchor="end" fill="#cbd5e1" font-size="20">-3</text></g><g><line x1="115" x2="1075" y1="330" y2="330" stroke="#334155"></line><text x="95" y="337" text-anchor="end" fill="#cbd5e1" font-size="20">0</text></g><g><line x1="115" x2="1075" y1="255" y2="255" stroke="#334155"></line><text x="95" y="262" text-anchor="end" fill="#cbd5e1" font-size="20">3</text></g><g><line x1="115" x2="1075" y1="180" y2="180" stroke="#334155"></line><text x="95" y="187" text-anchor="end" fill="#cbd5e1" font-size="20">6</text></g><g><line x1="115" y1="330" x2="1075" y2="330" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="8 6"></line><text x="60" y="565" fill="#ddd6fe" font-size="22">1. Nulllinie</text></g><g><polyline points="115,430 195,405 275,380 355,330 435,280 515,230 595,255 675,280 755,330 835,380 915,405 995,380 1075,330" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></polyline><line x1="60" x2="95" y1="522" y2="522" stroke="#67e8f9" stroke-width="4"></line><text x="110" y="530" fill="#67e8f9" font-size="22">MACD</text></g><g><polyline points="115,405 195,405 275,400 355,380 435,350 515,310 595,287.5 675,285 755,300 835,330 915,360 995,367.5 1075,355" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 8"></polyline><line x1="330" x2="365" y1="522" y2="522" stroke="#fcd34d" stroke-width="4" stroke-dasharray="8 5"></line><text x="380" y="530" fill="#fcd34d" font-size="22">Signal</text></g><text x="1075" y="520" text-anchor="end" fill="#cbd5e1" font-size="20">Zeit →</text><text x="60" y="617" fill="#e2e8f0" font-size="20">Synthetisches Lernbeispiel · keine Live-Kurse · keine Anlageberatung</text><text x="60" y="650" fill="#94a3b8" font-size="19">Schematische Geometrie · keine berechneten Signale · capital-ai.online/learning</text></g></svg>
