 <text x="654" y="318" fill="#F9BF21" font-size="18" font-weight="700">03  LEGAL + QA</text>
 <text x="654" y="365" fill="#F8FAFC" font-size="22" font-weight="700">Rechte prüfen</text>
 <text x="654" y="397" fill="#B7C3D7" font-size="16">Lizenz · Hash</text>
 <text x="654" y="422" fill="#B7C3D7" font-size="16">A11y · Review</text>
 <text x="654" y="459" fill="#F9BF21" font-size="13" font-weight="700">FAIL-CLOSED</text>
