 <text x="942" y="397" fill="#B7C3D7" font-size="16">OAuth · Freigabe</text>
 <text x="942" y="422" fill="#B7C3D7" font-size="16">Provider-Readback</text>
 <text x="942" y="459" fill="#F1A7B3" font-size="13" font-weight="700">AKTUELL GESPERRT</text>
