 <rect x="55" y="272" width="252" height="215" rx="18" fill="#101A2C" stroke="#33425D"/>
 <rect x="55" y="272" width="252" height="7" rx="3" fill="#22D3EE"/>
 <text x="78" y="318" fill="#22D3EE" font-size="18" font-weight="700">01  QUELLEN</text>
 <text x="78" y="365" fill="#F8FAFC" font-size="22" font-weight="700">Belege zuerst</text>
 <text x="78" y="397" fill="#B7C3D7" font-size="16">Datum · Herkunft</text>
 <text x="78" y="422" fill="#B7C3D7" font-size="16">Rechte · Fakten</text>
 <text x="78" y="459" fill="#22D3EE" font-size="13" font-weight="700">VERIFIZIEREN</text>
 <path d="M317 380h17m-7-7 7 7-7 7" stroke="#7D8BA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
 <rect x="343" y="272" width="252" height="215" rx="18" fill="#101A2C" stroke="#33425D"/>
 <rect x="343" y="272" width="252" height="7" rx="3" fill="#A855F7"/>
 <text x="366" y="318" fill="#C59AFB" font-size="18" font-weight="700">02  REDAKTION</text>
 <text x="366" y="365" fill="#F8FAFC" font-size="22" font-weight="700">Text + Grafik</text>
 <text x="366" y="397" fill="#B7C3D7" font-size="16">SEO · Alt-Text</text>
 <text x="366" y="422" fill="#B7C3D7" font-size="16">Kanalvarianten</text>
 <text x="366" y="459" fill="#C59AFB" font-size="13" font-weight="700">ENTWURF</text>
 <path d="M605 380h17m-7-7 7 7-7 7" stroke="#7D8BA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
