<line x1="55" y1="522" x2="1145" y2="522" stroke="#25304A"/>
<text x="55" y="561" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="19" font-weight="700">DRAFT ≠ PUBLISHED</text>
<text x="55" y="591" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">Architekturprinzip · Keine Live-Publishing- oder Sicherheitszertifizierung</text>
