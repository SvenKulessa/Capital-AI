<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">CAPITAL AI: Sicherer Content-Autopilot</title>
<desc id="desc">Vier Stufen von belegten Quellen über Redaktion und Grafik zur Lizenz- und Qualitätsprüfung. Der letzte Schritt Veröffentlichung ist gesperrt, bis Rechte, Freigabe und Provider-Readback vorliegen.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#02050E"/><stop offset="1" stop-color="#090E21"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#F9BF21"/><stop offset="1" stop-color="#FBE38A"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1060" cy="85" r="200" fill="#22D3EE" opacity=".055"/>
<circle cx="80" cy="600" r="200" fill="#A855F7" opacity=".05"/>
<rect x="55" y="46" width="150" height="31" rx="15.5" fill="#1E273D" stroke="#46516B"/>
<text x="130" y="67" fill="#F9BF21" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.3">CAPITAL AI</text>
<text x="55" y="143" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="49" font-weight="700">Sicherer Content-Autopilot</text>
<text x="55" y="188" fill="#B7C3D7" font-family="Arial,sans-serif" font-size="22">Professioneller Content braucht mehr als einen guten Prompt.</text>
<text x="55" y="242" fill="#94A3B8" font-family="Arial,sans-serif" font-size="16" letter-spacing="1.8">VIER KONTROLLIERTE STUFEN</text>
