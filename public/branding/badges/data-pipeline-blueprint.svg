<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">CAPITAL-AI Data Pipeline Blueprint</title>
  <desc id="desc">Quadratischer Cyan-Blau Blueprint-Badge mit hierarchischem Pipeline-Baum, Datenknoten und Evidence-Siegel.</desc>
  <metadata>Copyright © 2026 Sven Michael Kulessa. LicenseRef-CAPITAL-AI-DATA-PIPELINE-BLUEPRINT-BADGE-1.0. Original CAPITAL-AI asset inspired by the deterministic SocialMediaEngine planning-visual workflow, without copied Finance artwork.</metadata>
  <defs>
    <radialGradient id="bg" cx="48%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".17"/>
      <stop offset="48%" stop-color="#061520"/>
      <stop offset="100%" stop-color="#02070C"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFFAFE"/>
      <stop offset="45%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
