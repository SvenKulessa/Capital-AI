    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="7" y="7" width="242" height="242" rx="34" fill="url(#bg)" stroke="url(#rim)" stroke-width="2.4"/>
  <rect x="14" y="14" width="228" height="228" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
