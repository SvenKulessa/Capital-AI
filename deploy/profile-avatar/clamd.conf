# CAPITAL-AI: private scanner, same UID 1000, never a TCP listener.
Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
FailIfCvdOlderThan 2
SelfCheck 3600
MaxThreads 1
MaxConnectionQueueLength 5
ReadTimeout 10
CommandReadTimeout 10
StreamMaxLength 3M
MaxFileSize 4M
MaxScanSize 8M
MaxRecursion 4
MaxFiles 50
