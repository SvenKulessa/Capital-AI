server_name: capital-ai-market-events
listen: 0.0.0.0:4222
authorization {
  # Required environment variable. Missing token causes configuration failure.
  token: $NATS_TOKEN
}
jetstream {
  store_dir: /var/data/jetstream
  max_memory_store: 64MB
  max_file_store: 2GB
}
max_connections: 50
max_payload: 262144
max_pending: 8MB
write_deadline: "5s"
# No monitoring, websocket, gateway or cluster listener enabled.
