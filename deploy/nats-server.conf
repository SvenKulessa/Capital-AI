server_name: capital-ai-market-events
listen: 0.0.0.0:4222
authorization {
  users: [
    {
      user: $NATS_APP_USER
      password: $NATS_APP_PASSWORD
      permissions: {
        publish: {
          allow: [
            "capital.facts.quote.*",
            "capital.scores.crypto.*",
            "capital.private.provider.query.v1",
            "_INBOX.>",
            "$JS.API.INFO",
            "$JS.API.STREAM.CREATE.CAPITAL_FACTS",
            "$JS.API.STREAM.INFO.CAPITAL_FACTS",
            "$JS.API.STREAM.MSG.GET.CAPITAL_FACTS",
            "$JS.API.DIRECT.GET.CAPITAL_FACTS",
            "$JS.API.STREAM.CREATE.CAPITAL_SCORES",
            "$JS.API.STREAM.INFO.CAPITAL_SCORES",
            "$JS.API.STREAM.MSG.GET.CAPITAL_SCORES",
            "$JS.API.DIRECT.GET.CAPITAL_SCORES"
          ]
        }
        subscribe: {
          allow: ["_INBOX.>", "capital.private.provider.execute.v1"]
        }
      }
    },
    {
      user: $NATS_BRIDGE_USER
      password: $NATS_BRIDGE_PASSWORD
      permissions: {
        publish: {
          allow: ["capital.private.provider.execute.v1", "_INBOX.>"]
        }
        subscribe: {
          allow: ["capital.private.provider.query.v1", "_INBOX.>"]
        }
      }
    }
  ]
}
jetstream {
  store_dir: /var/data/jetstream
  max_memory_store: 64MB
  max_file_store: 2GB
}
max_connections: 50
max_payload: 262144
max_pending: 8MB
write_deadline: "5s"
ping_interval: "20s"
ping_max: 2
# Private TCP only. No monitoring, websocket, gateway, leafnode or cluster listener.
# TLS remains a separate PLATFORM gate; do not expose this listener outside the private network.
