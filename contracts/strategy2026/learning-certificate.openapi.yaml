openapi: 3.1.0
info:
  title: CAPITAL-AI Learning Certificate Contract
  version: 0.1.0-candidate
  description: Contract only; no deployed endpoint or authorization change.
servers:
  - url: https://capital-ai.online
x-capital-ai-status: CONTRACT_ONLY_NOT_DEPLOYED
paths:
  /api/learning/certificates/{certificateId}:
    get:
      operationId: getLearningCertificate
      summary: Read current user's certificate metadata
      security:
        - existingBffSession: []
      parameters:
        - in: path
          name: certificateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized user-owned certificate metadata
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '401':
          description: Unauthenticated
        '403':
          description: Not entitled
        '404':
          description: Missing or not owned
        '429':
          description: Rate limited
components:
  securitySchemes:
    existingBffSession:
      type: apiKey
      in: cookie
      name: capital_ai_session
      description: Placeholder for existing verified BFF session; do not create new cookie.
  schemas:
    Certificate:
      type: object
      additionalProperties: false
      required: [id, courseSlug, assessmentVersion, issuedAt, revoked]
      properties:
        id:
          type: string
          format: uuid
        courseSlug:
          type: string
          pattern: '^[a-z0-9-]{1,80}$'
        assessmentVersion:
          type: integer
          minimum: 1
        issuedAt:
          type: string
          format: date-time
        revoked:
          type: boolean
