services:
  - type: web
    name: Capital-AI
    runtime: docker
    # Starter: 0.5 CPU, 512 MB; matches the existing Render service.
    plan: 0.5c-512mb
    numInstances: 1
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: off
    previews:
      generation: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MARKET_SYMBOLS
        value: BTCUSDT,BTCUSD,AAPL
      # All optional capabilities fail closed until configured by the owner.
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AUTH_COOKIE_SIGNING_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ALLOWED_SUBJECTS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_APP_USER
        value: capital-ai-market-runtime
      - key: NATS_APP_PASSWORD
        sync: false
      - key: NATS_EXECUTOR_USER
        value: capital-ai-provider-executor
      - key: NATS_EXECUTOR_PASSWORD
        sync: false
      - key: PRIVATE_PROVIDER_QUERY_SIGNING_SECRET
        sync: false
      # Enable only after the dedicated Rust worker is live and its healthcheck passes.
      - key: PRIVATE_PROVIDER_BRIDGE_ENABLED
        value: "false"
      # Legacy migration fallback only; remove after three validated scoped-auth cycles.
      - key: NATS_TOKEN
        sync: false
      - key: NATS_REPLICAS
        value: "1"
      - key: MARKET_PUBSUB_ENABLED
        value: "true"
      - key: MARKET_QUOTES_ENABLED
        value: "false"
      - key: CAPITAL_AI_FINANCE_SCORER_PRIVATE_ORIGIN
        sync: false
      - key: CAPITAL_AI_SCORER_ORIGIN
        value: https://capital-ai.online
      - key: CAPITAL_AI_SCORER_ALLOW_SAME_ORIGIN
        value: "true"
