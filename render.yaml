services:
  - type: web
    name: Capital-AI
    runtime: docker
    # Starter: 0.5 CPU, 512 MB; matches the existing Render service.
    plan: 0.5c-512mb
    numInstances: 1
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    previews:
      generation: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Only currently admitted daily ECB reference instruments; no proprietary market-price redistribution.
      - key: MARKET_SYMBOLS
        value: "EUR/USD,EUR/JPY,EUR/CZK,EUR/DKK,EUR/GBP,EUR/HUF,EUR/PLN,EUR/RON,EUR/SEK,EUR/CHF,EUR/ISK,EUR/NOK,EUR/TRY,EUR/AUD,EUR/BRL,EUR/CAD,EUR/CNY,EUR/HKD,EUR/IDR,EUR/ILS"
      # All optional capabilities fail closed until configured by the owner.
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AUTH_COOKIE_SIGNING_SECRET
        sync: false
      # Owner-only GA4 provider readback. Values stay server-side on this web service.
      - key: GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_ANALYTICS_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_ANALYTICS_PROPERTY_NUMBER
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ALLOWED_SUBJECTS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_APP_USER
        value: capital-ai-market-runtime
      - key: NATS_APP_PASSWORD
        sync: false
      - key: NATS_EXECUTOR_USER
        value: capital-ai-provider-executor
      - key: NATS_EXECUTOR_PASSWORD
        sync: false
      - key: PRIVATE_PROVIDER_QUERY_SIGNING_SECRET
        sync: false
      # Probe-only transport may be enabled independently; customer provider queries remain closed.
      - key: PRIVATE_PROVIDER_BRIDGE_PROBE_ENABLED
        value: "false"
      # Full provider-query surface stays disabled until the complete State/Vault/provider chain is admitted.
      - key: PRIVATE_PROVIDER_BRIDGE_ENABLED
        value: "false"
      # Legacy migration fallback only; remove after three validated scoped-auth cycles.
      - key: NATS_TOKEN
        sync: false
      - key: NATS_REPLICAS
        value: "1"
      - key: MARKET_PUBSUB_ENABLED
        value: "true"
      # Enabling this path does not authorize legacy providers, trading or scoring.
      - key: MARKET_QUOTES_ENABLED
        value: "true"
      - key: MARKET_ECB_REFERENCE_RATES_ENABLED
        value: "true"
      - key: CAPITAL_AI_FINANCE_SCORER_PRIVATE_ORIGIN
        sync: false
      - key: CAPITAL_AI_SCORER_ORIGIN
        value: https://capital-ai.online
      - key: CAPITAL_AI_SCORER_ALLOW_SAME_ORIGIN
        value: "true"
      # Chat Buddy liest nur die Namen. Werte bleiben im Render-Dashboard.
      # Kostenpflichtige oder abrechenbare Schlüssel werden nicht aufgerufen.
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
