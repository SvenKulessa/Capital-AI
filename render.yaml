services:
  - type: web
    name: Capital-AI
    runtime: docker
    # Starter: 0.5 CPU, 512 MB; matches the existing Render service.
    plan: 0.5c-512mb
    numInstances: 1
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: off
    previews:
      generation: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MARKET_SYMBOLS
        value: BTCUSDT,BTCUSD,AAPL
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      # All optional capabilities fail closed until configured by the owner.
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ALLOWED_SUBJECTS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_TOKEN
        sync: false
      - key: NATS_REPLICAS
        value: "1"
      - key: MARKET_PUBSUB_ENABLED
        value: "true"
      - key: MARKET_QUOTES_ENABLED
        value: "true"
