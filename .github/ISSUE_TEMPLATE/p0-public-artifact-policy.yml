        "value": "## P0-02 · PLATFORM\nPlan: CAI-PUBLIC-SURFACE@1 · M1\nDependencies: P0-03. Use existing issues and PRs before creating duplicates. Do not post confidential security details, secrets or customer data. Acceptance criteria are checked at completion, not issue creation."
