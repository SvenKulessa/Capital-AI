name: TRUST npm Update Capsule

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/runtime/package.json'
      - 'deploy/runtime/package-lock.json'
      - '.github/workflows/npm-update-capsule.yml'
      - 'docs/security/evidence/toolchain-update-20261004/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-update-capsule:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: npm Build-Toolchain an Dockerfile angleichen
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "12.2.0"

      - name: Unveränderte PR-Lockfiles und Basis erfassen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-reports/npm-update
          node --version > security-reports/npm-update/node-version.txt
          npm --version > security-reports/npm-update/npm-version.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > security-reports/npm-update/tested-sha.txt
          git show "$BASE_SHA:package.json" > security-reports/npm-update/package.before.json
          git show "$BASE_SHA:package-lock.json" > security-reports/npm-update/package-lock.before.json
          git show "$BASE_SHA:deploy/runtime/package.json" > security-reports/npm-update/runtime-package.before.json
          git show "$BASE_SHA:deploy/runtime/package-lock.json" > security-reports/npm-update/runtime-package-lock.before.json
          cp package.json security-reports/npm-update/package.after.json
          cp package-lock.json security-reports/npm-update/package-lock.after.json
          cp deploy/runtime/package.json security-reports/npm-update/runtime-package.after.json
          cp deploy/runtime/package-lock.json security-reports/npm-update/runtime-package-lock.after.json
          git diff "$BASE_SHA" HEAD -- package.json package-lock.json deploy/runtime/package.json deploy/runtime/package-lock.json > security-reports/npm-update/root-lockfile.diff

      - name: Integrity- und Transitive-Diff erzeugen
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const before = JSON.parse(readFileSync('security-reports/npm-update/package-lock.before.json','utf8'));
          const after = JSON.parse(readFileSync('security-reports/npm-update/package-lock.after.json','utf8'));
          const pick = lock => Object.fromEntries(Object.entries(lock.packages ?? {})
            .filter(([name]) => name.startsWith('node_modules/'))
            .map(([name, value]) => [name.replace(/^node_modules\//,''), {
              version:value.version ?? null,
              integrity:value.integrity ?? null,
              license:value.license ?? null,
              resolved:value.resolved ?? null,
            }]));
          const a=pick(before), b=pick(after);
          const names=[...new Set([...Object.keys(a),...Object.keys(b)])].sort();
          const changes=names.flatMap(name => JSON.stringify(a[name]??null)===JSON.stringify(b[name]??null) ? [] : [{name,before:a[name]??null,after:b[name]??null}]);
          writeFileSync('security-reports/npm-update/transitive-diff.json', JSON.stringify({changes},null,2)+'\n');
          NODE
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          const direct=Object.keys(lock.packages?.['']?.dependencies ?? {});
          const evidence=Object.fromEntries(direct.map(name=>[name,lock.packages?.['node_modules/'+name]??null]));
          writeFileSync('security-reports/npm-update/direct-integrity-readback.json',JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Installations- und Funktionsprüfung
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix deploy/runtime --ignore-scripts --no-audit --no-fund
          npm run lint
          npm test
          npm run build
          git diff --exit-code -- package.json package-lock.json deploy/runtime/package.json deploy/runtime/package-lock.json

      - name: Lizenz- und CVE-Evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          npm audit --omit=dev --json > security-reports/npm-update/npm-audit-production.json
          audit_status=$?
          npm audit --json > security-reports/npm-update/npm-audit-all.json
          audit_all_status=$?
          node scripts/license-engine.mjs > security-reports/npm-update/license-report.txt
          license_status=$?
          jq -n             --argjson auditProduction "$audit_status"             --argjson auditAll "$audit_all_status"             --argjson license "$license_status"             '{auditProductionExit:$auditProduction,auditAllExit:$auditAll,licenseExit:$license}'             > security-reports/npm-update/tool-exit-status.json
          exit 0

      - name: Candidate-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-update-capsule-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            package.json
            package-lock.json
            deploy/runtime/package.json
            deploy/runtime/package-lock.json
            security-reports/npm-update/**

