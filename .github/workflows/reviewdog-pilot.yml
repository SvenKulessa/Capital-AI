name: Optional reviewdog Pilot

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Docker Build Sicherheit run with an unexpired security report
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  public-report:
    name: Advisory public report
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected run and artifact identity
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reviewdog-source-run.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: pilot-input
          merge-multiple: true
          digest-mismatch: error
      - name: Convert existing public source findings
        env:
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          ARTIFACT_SHA: ${{ steps.source.outputs.artifact_sha }}
        run: |
          node scripts/reviewdog-public-report.mjs pilot-input/source.public.json reviewdog.rdjson reviewdog-evidence.json "$SOURCE_HEAD_SHA" "$ARTIFACT_SHA"
      - name: Install checksum-pinned reviewdog
        run: |
          curl --fail --location --max-time 60 https://github.com/reviewdog/reviewdog/releases/download/v0.21.2/reviewdog_0.21.2_Linux_x86_64.tar.gz --output "$RUNNER_TEMP/reviewdog.tar.gz"
          echo "30413aa3c7443e9c3c157fe5766cad40e3bb39a32e210ee69b710a8d5c4b8e51  $RUNNER_TEMP/reviewdog.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/reviewdog-bin"
          tar --no-same-owner -xzf "$RUNNER_TEMP/reviewdog.tar.gz" -C "$RUNNER_TEMP/reviewdog-bin" reviewdog
      - name: Render advisory diagnostics without GitHub write authority
        run: |
          "$RUNNER_TEMP/reviewdog-bin/reviewdog" -f=rdjson -reporter=local -filter-mode=nofilter -fail-level=none < reviewdog.rdjson
          echo '### Optional reviewdog Pilot' >> "$GITHUB_STEP_SUMMARY"
          echo 'Advisory public summary only. No inline locations, no new scan, no review approval or production clearance.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reviewdog-evidence.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewdog-pilot-${{ github.run_id }}
          path: |
            reviewdog.rdjson
            reviewdog-evidence.json
            reviewdog-source-run.json
          if-no-files-found: error
          retention-days: 7
