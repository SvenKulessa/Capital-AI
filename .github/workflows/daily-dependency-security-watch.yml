name: Daily Dependency and CVE Watch

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-dependency-security-watch
  cancel-in-progress: true

jobs:
  dependency-watch:
    name: Dependency Version and CVE Watch
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture available npm updates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p security-reports
          npm outdated --json > security-reports/npm-outdated.json || test $? -eq 1
      - name: Fail on high or critical npm advisories
        run: npm audit --audit-level=high --json > security-reports/npm-audit.json
      - name: Record pinned runtime identities
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Runtime pins"
            grep -E '^FROM ' Dockerfile || true
            grep -E '^FROM ' deploy/Dockerfile.nats || true
            grep -E '"(@nats-io/|redis|jose|vite|react|express)' package.json || true
          } > security-reports/runtime-pins.txt
      - name: Upload daily evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-dependency-security-watch-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 14
