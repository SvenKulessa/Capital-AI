name: ZITADEL Policy OIDC Passkey Readback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zitadel-readback
  cancel-in-progress: false

jobs:
  readback:
    name: Secretfreier ZITADEL Trust Readback
    if: github.repository == 'SvenKulessa/Capital-AI'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Offline fail-closed regressions
        run: node --test scripts/zitadel-readback.test.mjs
      - name: Read Policy OIDC and Passkey state
        env:
          ZITADEL_SERVICE_PAT: ${{ secrets.ZITADEL_SERVICE_PAT }}
          ZITADEL_SERVICE_CLIENT_ID: ${{ secrets.ZITADEL_SERVICE_CLIENT_ID }}
          ZITADEL_SERVICE_CLIENT_SECRET: ${{ secrets.ZITADEL_SERVICE_CLIENT_SECRET }}
          ZITADEL_PROJECT_ID: ${{ vars.ZITADEL_PROJECT_ID }}
          ZITADEL_APP_ID: ${{ vars.ZITADEL_APP_ID }}
          ZITADEL_READBACK_OUTPUT: ${{ runner.temp }}/zitadel-readback.json
        run: node scripts/zitadel-readback.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Publish redacted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zitadel-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/zitadel-readback.json
          if-no-files-found: error
          retention-days: 14
