name: Optional Offline LangGraph Worker Candidate

on:
  pull_request:
    paths:
      - 'deploy/Dockerfile.langgraph-worker'
      - 'deploy/Dockerfile.langgraph-worker.dockerignore'
      - 'scripts/growth-agent/agent_platform.py'
      - 'scripts/growth-agent/checkpoint_store.py'
      - 'scripts/growth-agent/licensed_context_offline_graph.py'
      - 'scripts/growth-agent/test_licensed_context_offline_graph.py'
      - 'scripts/growth-agent/product_opportunity_graph.py'
      - 'scripts/growth-agent/test_product_opportunity_graph.py'
      - 'scripts/growth-agent/worker_service.py'
      - 'scripts/growth-agent/continuous_pr_supervisor.py'
      - 'scripts/growth-agent/test_continuous_pr_supervisor.py'
      - 'scripts/growth-agent/trusted_ci_round_adapter.py'
      - 'scripts/growth-agent/test_trusted_ci_round_adapter.py'
      - 'scripts/growth-agent/worker_oci_evidence.py'
      - 'scripts/growth-agent/test_worker_oci_evidence.py'
      - 'scripts/growth-agent/worker_os_licenses.py'
      - 'scripts/growth-agent/test_worker_os_licenses.py'
      - '.github/workflows/langgraph-worker-candidate.yml'

permissions:
  contents: read

jobs:
  offline-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve immutable BellSoft Python 3.14 glibc build/runtime digests
        id: base
        shell: bash
        run: |
          set -euo pipefail
          # Exact immutable digests from successful candidate scan 44477933980.
          build_ref="bellsoft/hardened-python@sha256:267c24fca93f8882fde084442224fe230231b0c0b095f4b182ecb2d54d6cb72a"
          runtime_ref="bellsoft/hardened-python@sha256:bb03a9fdd7fd8e03b3ac887ca6c480d29aba1a4fe99e1eee6501588042e5f2d9"
          docker pull --platform linux/amd64 "$build_ref"
          docker pull --platform linux/amd64 "$runtime_ref"
          [[ "$build_ref" =~ ^(docker.io/)?bellsoft/hardened-python@sha256:[a-f0-9]{64}$ ]]
          [[ "$runtime_ref" =~ ^(docker.io/)?bellsoft/hardened-python@sha256:[a-f0-9]{64}$ ]]
          test "$(docker image inspect --format '{{.Architecture}}' "$build_ref")" = "amd64"
          test "$(docker image inspect --format '{{.Architecture}}' "$runtime_ref")" = "amd64"
          build_python="$(docker run --rm --platform linux/amd64 --entrypoint python3 "$build_ref" -c 'import sys; print(".".join(map(str, sys.version_info[:2])))')"
          runtime_python="$(docker run --rm --platform linux/amd64 --entrypoint python3 "$runtime_ref" -c 'import sys; print(".".join(map(str, sys.version_info[:2])))')"
          test "$build_python" = "3.14"
          test "$runtime_python" = "$build_python"
          printf 'build_ref=%s\nref=%s\n' "$build_ref" "$runtime_ref" >> "$GITHUB_OUTPUT"
          printf 'BASE_PROVENANCE build=%s runtime=%s python=%s\n' "$build_ref" "$runtime_ref" "$runtime_python"
      - name: Build unactivated worker candidate
        shell: bash
        env:
          PYTHON_BASE: ${{ steps.base.outputs.ref }}
          PYTHON_BUILD_BASE: ${{ steps.base.outputs.build_ref }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg "PYTHON_BASE=$PYTHON_BASE" \
            --build-arg "PYTHON_BUILD_BASE=$PYTHON_BUILD_BASE" \
            --file deploy/Dockerfile.langgraph-worker \
            --tag "capital-ai-langgraph-candidate:$GITHUB_SHA" .
      - name: Verify UID and offline default-deny
        shell: bash
        run: |
          set -euo pipefail
          image="capital-ai-langgraph-candidate:$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python3 "$image" \
            -c 'import sys;sys.path.insert(0,"/app/scripts/growth-agent");from agent_platform import build_research_graph;g=build_research_graph("/app");result=g.invoke({"task_id":"smoke","domain":"PLATFORM","query":"LangGraph checkpoint"});assert result["status"]=="RESEARCH_DRAFT",result;assert "trust_reviewer" in result["agent_route"];print("OFFLINE_RAG_PASS")'
          set +e
          output="$(docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges "$image" 2>&1)"
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'worker disabled by default' <<< "$output"
          echo "DEFAULT_DENY_PASS"
          # Scope #874: exercise the actual pinned LangGraph StateGraph offline,
          # without granting additional rights or enabling the candidate worker.
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python3 "$image" \
            -m unittest discover -s /app/scripts/growth-agent \
            -p test_product_opportunity_graph.py -v
          echo "OPPORTUNITY_LANGGRAPH_OFFLINE_TESTED"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python3 "$image" \
            -m unittest discover -s /app/scripts/growth-agent \
            -p test_licensed_context_offline_graph.py -v
          echo "LICENSED_CONTEXT_CHECKPOINT_PASS"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python3 "$image" \
            -m unittest discover -s /app/scripts/growth-agent \
            -p test_continuous_pr_supervisor.py -v
          echo "PR_CI_WAKE_SUPERVISOR_OFFLINE_TESTED"
      - name: Scan entire candidate for vulnerabilities and secrets
        shell: bash
        run: |
          set -euo pipefail
          image="capital-ai-langgraph-candidate:$GITHUB_SHA"
          docker save "$image" --output /tmp/offline-candidate.tar
          chmod 0644 /tmp/offline-candidate.tar
          docker run --rm \
            -v /tmp/offline-candidate.tar:/candidate.tar:ro \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /candidate.tar --scanners vuln,secret \
            --ignorefile /dev/null --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress
          echo "CANDIDATE_SCAN_PASS"
      - name: Inventory exact unactivated candidate image (CycloneDX, SPDX, licensing)
        shell: bash
        env:
          PYTHON_BUILD_BASE: ${{ steps.base.outputs.build_ref }}
          PYTHON_BASE: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          image="capital-ai-langgraph-candidate:$GITHUB_SHA"
          evidence="$RUNNER_TEMP/langgraph-worker-evidence"
          mkdir -p "$evidence"
          trivy="aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb"
          # Same candidate.tar as the preceding, unchanged vulnerability/secret gate.
          docker run --rm \
            -v /tmp/offline-candidate.tar:/candidate.tar:ro \
            -v "$evidence:/reports" \
            "$trivy" image --input /candidate.tar --format cyclonedx \
            --output /reports/worker.cdx.json --no-progress
          docker run --rm \
            -v /tmp/offline-candidate.tar:/candidate.tar:ro \
            -v "$evidence:/reports" \
            "$trivy" image --input /candidate.tar --format spdx-json \
            --output /reports/worker.spdx.json --no-progress
          # Distroless images may strip the APK database; absence is NOT_PROVEN.
          # Inventory the actual final image with its own unprivileged Python.
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 --entrypoint python3 "$image" \
            /app/scripts/growth-agent/worker_os_licenses.py \
            > "$evidence/worker-os-packages.json"
          python3 scripts/growth-agent/worker_oci_evidence.py \
            --archive /tmp/offline-candidate.tar \
            --cyclonedx "$evidence/worker.cdx.json" \
            --spdx "$evidence/worker.spdx.json" \
            --os-inventory "$evidence/worker-os-packages.json" \
            --image-id "$(docker image inspect --format '{{.Id}}' "$image")" \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --tested-checkout-sha "$GITHUB_SHA" \
            --builder-ref "$PYTHON_BUILD_BASE" --runtime-ref "$PYTHON_BASE" \
            --output "$evidence/worker-license-inventory.json"
          echo "SBOM_LICENSE_INVENTORY_REVIEW_REQUIRED"

      - name: Prove synthetic SQLite persistence across isolated container restarts
        shell: bash
        run: |
          set -euo pipefail
          image="capital-ai-langgraph-candidate:$GITHUB_SHA"
          state="$(mktemp -d "$RUNNER_TEMP/capital-ai-checkpoint.XXXXXXXX")"
          trap 'sudo rm -rf -- "$state"' EXIT
          mkdir -p "$state/checkpoints" "$state/inbox" "$state/approvals"
          printf '%s\n' '{"schema":"CAPITAL_AI_OFFLINE_RESEARCH@1","task_id":"ci-restart-001","domain":"PLATFORM","query":"LangGraph checkpoint"}' > "$state/inbox/task.json"
          chmod 0600 "$state/inbox/task.json"
          chmod 0700 "$state" "$state/checkpoints" "$state/inbox" "$state/approvals"
          sudo chown -R 10001:10001 "$state"

          run_research() {
            docker run --rm --platform linux/amd64 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --user 10001:10001 \
              --mount "type=bind,src=$state,dst=/var/lib/capital-ai-agent" \
              --entrypoint python3 "$image" \
              /app/scripts/growth-agent/worker_service.py \
              --single /var/lib/capital-ai-agent/inbox/task.json
          }
          checkpoint_count() {
            docker run --rm --platform linux/amd64 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --user 10001:10001 \
              --mount "type=bind,src=$state,dst=/var/lib/capital-ai-agent" \
              --entrypoint python3 "$image" -c \
              'from pathlib import Path;import sqlite3;p=list(Path("/var/lib/capital-ai-agent/checkpoints").glob("*.sqlite3"));assert len(p)==1;db=sqlite3.connect("file:"+str(p[0])+"?mode=ro",uri=True);print(db.execute("SELECT COUNT(*) FROM checkpoints").fetchone()[0]);db.close()'
          }
          # Fresh, separate PID/container each time; no model or provider network.
          first="$(run_research)"
          echo "$first" | grep -q '"status": "RESEARCH_DRAFT"'
          before="$(checkpoint_count)"
          test "$before" -gt 0
          second="$(run_research)"
          third="$(run_research)"
          test "$first" = "$second"
          test "$second" = "$third"
          test "$(checkpoint_count)" = "$before"
          test "$(sudo stat -c %a "$state/checkpoints")" = "700"
          test "$(sudo stat -c %u "$state/checkpoints")" = "10001"
          test "$(sudo stat -c %a "$state/inbox/task.json")" = "600"

          # An exposed approval directory must block execution, not write state.
          sudo chmod 0755 "$state/approvals"
          set +e
          run_research >/dev/null 2>&1
          rejected=$?
          set -e
          test "$rejected" -ne 0
          sudo chmod 0700 "$state/approvals"
          test "$(checkpoint_count)" = "$before"

          # No real mount: --serve must fail even if explicitly enabled.
          set +e
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --env CAPITAL_AI_OFFLINE_WORKER_ENABLED=true \
            "$image" >/dev/null 2>&1
          mount_denied=$?
          set -e
          test "$mount_denied" -ne 0
          echo "SYNTHETIC_DOCKER_MOUNT_RESTART_PASS"
      - name: Retain source-bound unactivated worker inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: langgraph-worker-sbom-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/langgraph-worker-evidence/worker.cdx.json
            ${{ runner.temp }}/langgraph-worker-evidence/worker.spdx.json
            ${{ runner.temp }}/langgraph-worker-evidence/worker-os-packages.json
            ${{ runner.temp }}/langgraph-worker-evidence/worker-license-inventory.json
          if-no-files-found: warn
          retention-days: 30
