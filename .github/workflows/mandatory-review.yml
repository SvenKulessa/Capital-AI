name: Optional Repository Review

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  review:
    name: Optional Manual Review
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Hinweis
        run: |
          echo "Periodische Pflichtreviews sind durch SOLO_MAINTAINER_FLOW@1 deaktiviert."
          echo "Security-, Dependency- und Runtime-Monitoring bleiben Evidence, aber kein Entwicklungs- oder Release-Gate."
