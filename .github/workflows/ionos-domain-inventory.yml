name: IONOS Domain Inventory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ionos-domain-migration
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'SvenKulessa/Capital-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read-only boundary and credential handling tests
        run: node --test scripts/ionos-domain-inventory.test.mjs
      - name: Inventory authorized hostnames and probe target deployment
        env:
          IONOS_API_KEY: ${{ secrets.IONOS_API_KEY }}
        run: node scripts/ionos-domain-inventory.mjs
      - name: Save rollback web records and gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: domain-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
