name: PR 365 Learning Checks (owner triggered)

on:
  workflow_dispatch:
  push:
    branches:
      - capital-ai-platform/learning-vocabulary-ux-20261010

permissions:
  contents: read

concurrency:
  group: pr365-learning-checks
  cancel-in-progress: false

jobs:
  verify:
    # workflow_dispatch requires the workflow to exist on the default branch.
    # On this unmerged PR branch, start manually with a commit whose message
    # includes [run-pr365-checks]; ordinary pushes do not execute these checks.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-pr365-checks]')
    name: Lint, Learning Portal, SEO Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audited PR code at exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5f7fc38942968d39231063ba5774c9c445f00445
          persist-credentials: false

      - name: Verify audited commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="5f7fc38942968d39231063ba5774c9c445f00445"
          echo "Tested SHA: $actual"
          test "$actual" = "$expected"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install dependencies from lockfile
        id: install
        run: npm ci

      - name: Lint and TypeScript boundaries
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Learning Portal tests
        id: learning
        continue-on-error: true
        run: npm run test:learning-portal

      - name: SEO provenance consistency
        id: provenance
        continue-on-error: true
        run: npm run seo:provenance:check

      - name: Summarize all check results and fail on any non-success
        if: always()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          LEARNING: ${{ steps.learning.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## PR #365 — manually triggered checks'
            echo ''
            echo '- Tested source SHA: `5f7fc38942968d39231063ba5774c9c445f00445`'
            echo "- npm ci: $INSTALL"
            echo "- npm run lint: $LINT"
            echo "- npm run test:learning-portal: $LEARNING"
            echo "- npm run seo:provenance:check: $PROVENANCE"
            echo ''
            echo 'No merge, deployment, publication or repository write performed by this job.'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$INSTALL" == success && "$LINT" == success && "$LEARNING" == success && "$PROVENANCE" == success ]]
