name: Merge Milestones – Roadmap & News
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: capital-ai-merge-milestones
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: \${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node dependencies for existing Content Engine contract
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Milestone scheduler (read-only merge count)
        id: milestones
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test scripts/merge-milestone.test.mjs
          node --import tsx scripts/merge-milestone.mjs roadmap | tee /tmp/roadmap-milestone.txt
          node --import tsx scripts/merge-milestone.mjs news | tee /tmp/news-milestone.txt
          roadmap_number=$(sed -n 's/^MILESTONE_READY_//p' /tmp/roadmap-milestone.txt | tail -1)
          news_number=$(sed -n 's/^MILESTONE_READY_//p' /tmp/news-milestone.txt | tail -1)
          echo "roadmap=$roadmap_number" >> "$GITHUB_OUTPUT"
          echo "news=$news_number" >> "$GITHUB_OUTPUT"
      - name: Open milestone PRs (never merge or publish)
        env:
          GH_TOKEN: \${{ github.token }}
          REPOSITORY: \${{ github.repository }}
          SOURCE_SHA: \${{ github.event.pull_request.merge_commit_sha }}
          ROADMAP_NUMBER: \${{ steps.milestones.outputs.roadmap }}
          NEWS_NUMBER: \${{ steps.milestones.outputs.news }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          for category in roadmap news; do
            if [ "$category" = roadmap ]; then
              number="$ROADMAP_NUMBER"
              target="src/data/roadmapMergeReconciliation.json"
              doc="docs/product/roadmap-merge-reconciliation-$number.json"
              branch="capital-ai-product/roadmap-merge-pr-$number"
              title="[CAPITAL-AI-PRODUCT] Roadmap code- und dokumentbasiert bis PR #$number abgleichen"
              description="Deterministischer 10-PR-Abgleich mit Pfadexistenz, SHA-256 und fehlenden Nachweisen. Keine automatischen VERIFIED-Beförderungen."
            else
              number="$NEWS_NUMBER"
              target="src/data/controlCenterNews.json"
              doc="docs/growth/news-release-pr-$number.md"
              branch="capital-ai-growth/news-batch-pr-$number"
              title="[CAPITAL-AI-GROWTH] News-Blogentwurf zu 20 PR-Merges bis #$number"
              description="Quellgebundener Blogentwurf und Content-Engine-Plan. Social Media Engine publisher INTEGRATION_PENDING; keine Veröffentlichung."
            fi
            if [ -z "$number" ]; then continue; fi
            if gh pr list --repo "$REPOSITORY" --state all --head "$branch" --json number --jq 'length' | grep -qx '[1-9][0-9]*'; then
              echo "A milestone PR already exists for $branch."
              continue
            fi
            mkdir -p "/tmp/capital-milestone-$category/$(dirname "$target")"
            mkdir -p "/tmp/capital-milestone-$category/$(dirname "$doc")"
            cp "$target" "/tmp/capital-milestone-$category/$target"
            cp "$doc" "/tmp/capital-milestone-$category/$doc"
            git worktree add -b "$branch" "/tmp/capital-milestone-worktree-$category" "$SOURCE_SHA"
            cp "/tmp/capital-milestone-$category/$target" "/tmp/capital-milestone-worktree-$category/$target"
            mkdir -p "/tmp/capital-milestone-worktree-$category/$(dirname "$doc")"
            cp "/tmp/capital-milestone-$category/$doc" "/tmp/capital-milestone-worktree-$category/$doc"
            pushd "/tmp/capital-milestone-worktree-$category"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$target" "$doc"
            git commit -m "$title"
            git push --set-upstream origin "$branch"
            gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
              --draft --title "$title" \
              --body "$description"$'\n\n'"Source main: $SOURCE_SHA | Last merged PR: #$number | Automatic merge: disabled."
            popd
            echo "$category milestone proposal: PR #$number" >> "$GITHUB_STEP_SUMMARY"
          done
