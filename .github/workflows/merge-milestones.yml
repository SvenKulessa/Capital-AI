name: Merge Milestones – Roadmap & News
on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual post-merge verification. This mode never creates or updates a branch/PR.
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: capital-ai-merge-milestones
  cancel-in-progress: false
jobs:
  validate_app:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Validate milestone App credentials are configured
        env:
          APP_CLIENT_ID: ${{ vars.CAPITAL_AI_MILESTONE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CAPITAL_AI_MILESTONE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Milestone App Client ID or private-key Secret is missing.'
            echo 'APP_CONFIG_BLOCKED: missing Client ID or private-key Secret.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Mint Capital-AI-scoped App token (no repository writes)
        id: validation_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 (immutable)
        with:
          client-id: ${{ vars.CAPITAL_AI_MILESTONE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CAPITAL_AI_MILESTONE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Capital-AI
          permission-contents: write
          permission-pull-requests: write
      - name: Verify App installation with read-only repository API requests
        env:
          GH_TOKEN: ${{ steps.validation_token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          actual_repo="$(gh api "repos/$REPOSITORY" --jq '.full_name')"
          if [[ "$actual_repo" != "$REPOSITORY" ]]; then
            echo '::error::App token does not resolve the intended repository.'
            exit 1
          fi
          gh api "repos/$REPOSITORY/pulls?state=open&per_page=1" --jq 'length' >/dev/null
          echo 'APP_TOKEN_VERIFIED: repository-scoped token issued with requested Contents/Pull requests write permissions; read-only repository and PR API requests succeeded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No git push, PR creation, merge or deployment was attempted in this validation job.' >> "$GITHUB_STEP_SUMMARY"
  audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node dependencies for existing Content Engine contract
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate source-bound social content candidate (draft only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/growth/social-release-candidate.test.mjs
          node scripts/growth/social-release-candidate.mjs
      - name: Preserve social release candidate (no publish)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 pinned
        with:
          name: social-release-draft-${{ github.event.pull_request.number }}
          path: artifacts/social-content-candidates/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Milestone scheduler (read-only merge count)
        id: milestones
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test scripts/merge-milestone.test.mjs
          node --import tsx scripts/merge-milestone.mjs roadmap | tee /tmp/roadmap-milestone.txt
          node --import tsx scripts/merge-milestone.mjs news | tee /tmp/news-milestone.txt
          roadmap_number=$(sed -n 's/^MILESTONE_READY_//p' /tmp/roadmap-milestone.txt | tail -1)
          news_number=$(sed -n 's/^MILESTONE_READY_//p' /tmp/news-milestone.txt | tail -1)
          roadmap_date=$(sed -n 's/^MILESTONE_DATE_//p' /tmp/roadmap-milestone.txt | tail -1)
          news_date=$(sed -n 's/^MILESTONE_DATE_//p' /tmp/news-milestone.txt | tail -1)
          echo "roadmap=$roadmap_number" >> "$GITHUB_OUTPUT"
          echo "news=$news_number" >> "$GITHUB_OUTPUT"
          echo "roadmap_date=$roadmap_date" >> "$GITHUB_OUTPUT"
          echo "news_date=$news_date" >> "$GITHUB_OUTPUT"
      # Check both credentials before token minting; never print or persist private-key material.
      # An incomplete Owner setup must not turn a draft-only milestone into an authentication failure.
      - name: Check dedicated GitHub App configuration
        id: app_credentials
        if: ${{ steps.milestones.outputs.roadmap != '' || steps.milestones.outputs.news != '' }}
        env:
          APP_CLIENT_ID: ${{ vars.CAPITAL_AI_MILESTONE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CAPITAL_AI_MILESTONE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      # Only a separately installed App can mint an installation token to open PRs.
      # The default GITHUB_TOKEN is intentionally never used for draft PR writes.
      - name: Repository-scoped GitHub App token (optional)
        id: milestone_app
        if: ${{ steps.app_credentials.outputs.ready == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 (immutable)
        with:
          client-id: ${{ vars.CAPITAL_AI_MILESTONE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CAPITAL_AI_MILESTONE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Capital-AI
          permission-contents: write
          permission-pull-requests: write
      - name: Preserve deterministic milestone drafts for review
        if: ${{ always() && (steps.milestones.outputs.roadmap != '' || steps.milestones.outputs.news != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: milestone-drafts-${{ github.event.pull_request.number }}
          path: |
            src/data/roadmapMergeReconciliation.json
            src/data/controlCenterNews.json
            docs/product/roadmap-merge-reconciliation-*.json
            docs/growth/news-release-pr-*.md
          if-no-files-found: error
          retention-days: 14
      - name: Report missing app authority without creating a PR
        if: ${{ always() && (steps.milestones.outputs.roadmap != '' || steps.milestones.outputs.news != '') && steps.milestone_app.outputs.token == '' }}
        shell: bash
        run: |
          echo 'Milestone proposals generated, but no usable dedicated GitHub App token is available (missing credentials or token-minting failure). Drafts are available as an artifact; PR creation NOT_PROVEN / OWNER_SETUP_REQUIRED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No branch was pushed and no PR was created by the default GITHUB_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
      # Source identities may differ because Roadmap batches 10 merges and News batches 20.
      # A shared PR is safe only when BOTH source PR and UTC source date match.
      - name: Open provenance-scoped milestone draft PRs (never merge or publish)
        if: ${{ steps.milestone_app.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.milestone_app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          ROADMAP_NUMBER: ${{ steps.milestones.outputs.roadmap }}
          NEWS_NUMBER: ${{ steps.milestones.outputs.news }}
          ROADMAP_DATE: ${{ steps.milestones.outputs.roadmap_date }}
          NEWS_DATE: ${{ steps.milestones.outputs.news_date }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          # Command substitution propagates validation failures under set -e.
          plans="$(node scripts/merge-milestone-pr-plan.mjs)"
          if [[ -z "$plans" ]]; then
            echo 'No new roadmap/news milestone is due.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS='|' read -r scope number date_suffix; do
            [[ "$scope" =~ ^(roadmap|news|combined)$ ]] || { echo '::error::Invalid milestone scope.'; exit 1; }
            [[ "$number" =~ ^[1-9][0-9]{0,7}$ && "$date_suffix" =~ ^[0-9]{8}$ ]] || {
              echo '::error::Invalid milestone number or date.'; exit 1;
            }
            targets=()
            case "$scope" in
              roadmap)
                targets+=("src/data/roadmapMergeReconciliation.json" "docs/product/roadmap-merge-reconciliation-$number.json")
                ;;
              news)
                targets+=("src/data/controlCenterNews.json" "docs/growth/news-release-pr-$number.md")
                ;;
              combined)
                targets+=("src/data/roadmapMergeReconciliation.json" "docs/product/roadmap-merge-reconciliation-$number.json")
                targets+=("src/data/controlCenterNews.json" "docs/growth/news-release-pr-$number.md")
                ;;
            esac
            if [[ "$scope" == combined ]]; then
              branch="capital-ai-trust/milestone-merge-pr-$number-$date_suffix"
            else
              branch="capital-ai-trust/milestone-$scope-pr-$number-$date_suffix"
            fi
            title="[CAPITAL-AI-TRUST] $scope milestone draft from PR #$number"
            description="Source-bound $scope draft only. No VERIFIED promotion, automatic merge or publication."
            # Account for old consolidated drafts such as PR #471 (news #470).
            # A previous PR for the same source must be reviewed, not duplicated.
            existing=0
            for candidate_branch in "$branch" "capital-ai-trust/milestone-merge-pr-$number-$date_suffix"; do
              found="$(gh pr list --repo "$REPOSITORY" --state all --head "$candidate_branch" --json number --jq 'length')"
              [[ "$found" =~ ^[0-9]+$ ]] || { echo '::error::PR duplicate check unavailable.'; exit 1; }
              if (( found > 0 )); then existing=1; fi
            done
            if (( existing )); then
              echo "Milestone $scope #$number already has a PR; no duplicate or overwrite." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Distinguish an absent remote branch (exit 2) from permission/network errors.
            set +e
            git ls-remote --exit-code --heads origin "$branch" >/dev/null
            remote_status=$?
            set -e
            if (( remote_status == 0 )); then
              echo "::error::Milestone branch $branch exists without a matching PR; refusing overwrite."
              exit 1
            elif (( remote_status != 2 )); then
              echo "::error::Cannot reliably inspect milestone branch $branch (exit $remote_status)."
              exit 1
            fi
            worktree="/tmp/capital-milestone-worktree-$scope"
            git worktree add -b "$branch" "$worktree" "$SOURCE_SHA"
            for file in "${targets[@]}"; do
              test -f "$file"
              mkdir -p "$worktree/$(dirname "$file")"
              cp -- "$file" "$worktree/$file"
            done
            pushd "$worktree"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${targets[@]}"
            if git diff --cached --quiet; then
              echo "Milestone $scope #$number needs no new changes." >> "$GITHUB_STEP_SUMMARY"
              popd
              continue
            fi
            git commit -m "$title"
            git push --set-upstream origin "$branch"
            gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
              --draft --title "$title" \
              --body "$description"$'\n\n'"Source main: $SOURCE_SHA | Source milestone PR: #$number | Automatic merge: disabled."
            popd
            echo "Draft created: $scope milestone source PR #$number" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$plans"
