name: Pre-PR Critical Preflight

on:
  push:
    branches:
      - 'capital-ai-product/**'
      - 'capital-ai-market/**'
      - 'capital-ai-platform/**'
      - 'capital-ai-trust/**'
      - 'capital-ai-growth/**'

permissions:
  contents: read

concurrency:
  group: pre-pr-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-PR Critical Preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - name: Aktuellen Main und Workflow-Diff prüfen
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          echo "Geänderte Workflows gegenüber CURRENT_MAIN:"
          git diff --name-only origin/main...HEAD -- .github/workflows
          node --test scripts/pre-pr-workflow-policy.test.mjs
          git diff --check origin/main...HEAD

      - name: Dependencies deterministisch installieren
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Kritischen vollständigen Preflight ausführen
        run: npm run preflight:full
