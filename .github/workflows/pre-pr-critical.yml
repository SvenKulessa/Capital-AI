name: Branch Early Feedback

on:
  push:
    branches:
      - 'capital-ai-product/**'
      - 'capital-ai-market/**'
      - 'capital-ai-platform/**'
      - 'capital-ai-trust/**'
      - 'capital-ai-growth/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-early-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  early-feedback:
    name: Branch Early Feedback
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Schnelles Branch-Feedback
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          node --test scripts/pre-pr-workflow-policy.test.mjs
          git diff --check origin/main...HEAD
