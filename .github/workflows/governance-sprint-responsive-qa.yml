name: Governance Sprint Responsive QA
on:
  pull_request:
    paths:
      - 'src/features/home/GovernanceEvidenceSprintPage.tsx'
      - 'src/utils/analytics.ts'
      - 'src/utils/consentedAnalytics.ts'
      - 'src/utils/consentedAnalytics.test.ts'
      - 'shared/analytics-measurement-policy.mjs'
      - 'docs/product/agent-operations-pilot-preview.html'
      - 'scripts/governance-evidence-sprint.test.mjs'
      - 'scripts/qa/governance-sprint-browser.mjs'
      - '.github/workflows/governance-sprint-responsive-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-sprint-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    name: B2B Sprint Chromium and consent QA (isolated)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
          cache: npm
      - name: Existing consent, navigation and static denial tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --check scripts/qa/governance-sprint-browser.mjs
          node --import tsx --test src/utils/consentedAnalytics.test.ts
          npm run test:navigation
          npm run build
      - name: Chromium QA at 320, 390 and 1440 CSS pixels
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          CHROMIUM_BIN="$CHROME_BIN" node scripts/qa/governance-sprint-browser.mjs
      - name: Retain isolated screenshots and sanitized audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-sprint-qa-${{ github.sha }}
          path: artifacts/governance-sprint-qa/
          if-no-files-found: warn
          retention-days: 7
