name: Drive Backup Encryption Test
on:
  pull_request:
    paths:
      - 'scripts/platform/drive-encrypt.sh'
      - 'scripts/platform/drive-encryption-test.sh'
      - 'scripts/platform/backup-synthetic-restore-test.sh'
      - 'scripts/trust/verify-blueprint-backup.mjs'
      - 'scripts/trust/verify-blueprint-backup.test.mjs'
      - '.github/workflows/drive-encryption-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encryption-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install distribution-provided age (no third-party install scripts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age postgresql postgresql-client
          age --version
          sudo systemctl start postgresql
          sudo -u postgres pg_isready
      - name: Real cryptographic encryption/decryption smoke
        run: bash scripts/platform/drive-encryption-test.sh
      - name: Synthetic encrypted PostgreSQL dump and isolated restore
        run: bash scripts/platform/backup-synthetic-restore-test.sh
      - name: Verify configured public recovery recipient (synthetic data only)
        shell: bash
        env:
          CAPITAL_BACKUP_AGE_RECIPIENT: ${{ vars.CAPITAL_BACKUP_AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ -z "${CAPITAL_BACKUP_AGE_RECIPIENT:-}" ]]; then
            echo "BACKUP_AGE_RECIPIENT_NOT_CONFIGURED"
            exit 1
          fi
          testdir="$(mktemp -d "${RUNNER_TEMP}/age-recipient-XXXXXX")"
          trap 'rm -rf -- "$testdir"' EXIT
          printf 'CAPITAL-AI-SYNTHETIC-TEST-ONLY\n' > "$testdir/synthetic.txt"
          bash scripts/platform/drive-encrypt.sh "$testdir/synthetic.txt" "$testdir/synthetic.txt.age" >/dev/null
          test -s "$testdir/synthetic.txt.age"
          if cmp -s "$testdir/synthetic.txt" "$testdir/synthetic.txt.age"; then
            echo "BACKUP_AGE_PLAINTEXT_DETECTED"
            exit 1
          fi
          echo "BACKUP_AGE_PUBLIC_RECIPIENT_VALIDATED"
      - name: Verify encrypted Blueprint manifest and failure handling (synthetic fixtures)
        run: node --test scripts/trust/verify-blueprint-backup.test.mjs
