name: Owner Operations Visual QA
on:
  pull_request:
    paths:
      - 'src/components/RenderOwnerDashboardPage.tsx'
      - 'src/components/GrowthOwnerControlCenter.tsx'
      - 'src/components/growthOwnerWorkspaceModel.ts'
      - 'server/growth-owner-*.mjs'
      - 'scripts/growth/owner-engine-snapshot.mjs'
      - 'src/components/OwnerAgentOperationsPanel.tsx'
      - 'src/components/OwnerOperationsVisualOverview.tsx'
      - 'src/components/ownerOperationsVisual.css'
      - 'scripts/qa/owner-operations-visual-browser.mjs'
      - '.github/workflows/owner-operations-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-operations-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  visual:
    name: Owner Operations Chromium QA (isolated)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
          cache: npm
      - name: Exact PR build + existing owner visual model tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:owner-operations
          npm run build
      - name: Browser QA at 320, 390 and 1440 CSS pixels
        env:
          OWNER_OPERATIONS_QA_DIR: artifacts/owner-operations
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          CHROMIUM_BIN="$CHROME_BIN" node scripts/qa/owner-operations-visual-browser.mjs
      - name: Preserve only isolated fixture screenshots and metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-operations-visual-qa-${{ github.sha }}
          path: artifacts/owner-operations/
          if-no-files-found: warn
          retention-days: 7
