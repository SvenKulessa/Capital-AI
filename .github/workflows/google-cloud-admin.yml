# CAPITAL_AI_GCP_OPERATOR_KEYLESS_READBACK@1
# Manual main-only audit; read-only Google scope and IAM role; never enables a service.
name: Google Cloud Operator (readback or YouTube demo)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read Cloud APIs or upload an approved OAuth demo
        type: choice
        options: [readback, upload-youtube-demo]
        default: readback
      media_object_generation:
        description: Generation of youtube-verification/demo.mp4.enc in the private demo bucket
        type: string
        default: ''
      media_sha256:
        description: SHA-256 of the exact approved demo.mp4 bytes
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: capital-ai-cloud-operator-audit
  cancel-in-progress: false
jobs:
  service-usage-readback:
    if: github.repository == 'SvenKulessa/Capital-AI' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Verify source-only API client and negative cases
        run: node --test scripts/platform/google-cloud-admin-readback.test.mjs
      - name: Verify exact repository and operator identity
        env:
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -Eeuo pipefail
          [[ "$REPO_ID" == '1293009324' ]] || { echo 'CLOUD_OPERATOR_REPOSITORY_MISMATCH'; exit 1; }
          echo 'CLOUD_OPERATOR_LOCAL_IDENTITY_BOUND'
      - id: google_auth
        name: Federate GitHub OIDC to isolated GCP Cloud Operator
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: aifinancial-500208
          workload_identity_provider: projects/542877602707/locations/global/workloadIdentityPools/capital-ai-github-admin/providers/capital-ai-github-admin
          service_account: capital-ai-cloud-operator@aifinancial-500208.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform.read-only
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify active Cloud APIs (names redacted)
        env:
          GOOGLE_CLOUD_ADMIN_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node scripts/platform/google-cloud-admin-readback.mjs
  youtube-verification-demo:
    if: github.repository == 'SvenKulessa/Capital-AI' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'upload-youtube-demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: youtube-verification
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEMO_OBJECT_GENERATION: ${{ inputs.media_object_generation }}
      DEMO_SHA256: ${{ inputs.media_sha256 }}
      APPROVED_DEMO_SHA256: ${{ vars.YOUTUBE_DEMO_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Verify uploader negative cases without credentials
        run: node --test scripts/platform/youtube-verification-*.test.mjs
      - name: Require first attempt and expected repository
        env:
          REPO_ID: ${{ github.repository_id }}
        run: |
          test "$REPO_ID" = 1293009324
          test "$GITHUB_RUN_ATTEMPT" = 1
      - id: preflight
        name: Verify approved media digest and absence of prior upload claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/platform/youtube-verification-preflight.mjs
      - id: storage_auth
        name: Federate to the dedicated YouTube demo storage reader
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: aifinancial-500208
          workload_identity_provider: projects/542877602707/locations/global/workloadIdentityPools/capital-ai-github-admin/providers/capital-ai-github-admin
          service_account: capital-ai-youtube-demo@aifinancial-500208.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_only
          create_credentials_file: false
          export_environment_variables: false
      - name: Fetch the exact private demo object generation
        env:
          YOUTUBE_DEMO_BUCKET: ${{ vars.YOUTUBE_DEMO_BUCKET }}
          DEMO_STORAGE_ACCESS_TOKEN: ${{ steps.storage_auth.outputs.access_token }}
        run: node scripts/platform/youtube-verification-storage.mjs
      - name: Authenticate and verify encrypted demo before reserving upload
        env:
          YOUTUBE_DEMO_MEDIA_KEY: ${{ secrets.YOUTUBE_DEMO_MEDIA_KEY }}
        run: node scripts/platform/youtube-verification-upload.mjs --validate-media
      - name: Require configured channel-owner OAuth before reserving upload
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: |
          node --input-type=module -e 'for (const k of ["YOUTUBE_OAUTH_CLIENT_ID","YOUTUBE_OAUTH_CLIENT_SECRET","YOUTUBE_OAUTH_REFRESH_TOKEN"]) { if (!process.env[k]) { console.error("YOUTUBE_OAUTH_NOT_CONFIGURED"); process.exit(1); } }'
      - name: Persist claim before any YouTube insert
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.preflight.outputs.claim_name }}
          path: youtube-upload-claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload once with channel-owner OAuth, then read back
        env:
          YOUTUBE_DEMO_MEDIA_KEY: ${{ secrets.YOUTUBE_DEMO_MEDIA_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: node scripts/platform/youtube-verification-upload.mjs
      - name: Preserve receipt even after uncertain provider result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: youtube-demo-receipt-${{ github.run_id }}
          path: youtube-upload-receipt.enc
          if-no-files-found: ignore
          retention-days: 90
