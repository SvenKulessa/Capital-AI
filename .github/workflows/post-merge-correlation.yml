name: Post-Merge Correlation

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: post-merge-correlation
  cancel-in-progress: false

jobs:
  correlate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - name: Checkout merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ersten betroffenen linearen PR bestimmen
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGED_PR: ${{ github.event.pull_request.number }}
          MAIN_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p correlation

          gh api --paginate "repos/$REPOSITORY/pulls/$MERGED_PR/files?per_page=100"             --jq '.[].filename' | sort -u > correlation/merged-files.txt

          gh api --paginate "repos/$REPOSITORY/pulls?state=open&base=main&per_page=100&sort=created&direction=asc"             > correlation/open-prs.raw.json
          jq -s 'add // []' correlation/open-prs.raw.json > correlation/open-prs.json

          selected=""
          jq -c 'sort_by(.number)[] | select((.title | contains("[HOLD]")) | not) | select(.head.repo.full_name == env.REPOSITORY)'             correlation/open-prs.json | while IFS= read -r pr; do
              number=$(jq -r '.number' <<<"$pr")
              branch=$(jq -r '.head.ref' <<<"$pr")
              head_sha=$(jq -r '.head.sha' <<<"$pr")

              gh api --paginate "repos/$REPOSITORY/pulls/$number/files?per_page=100"                 --jq '.[].filename' | sort -u > "correlation/pr-$number-files.txt"

              exact=$(comm -12 correlation/merged-files.txt "correlation/pr-$number-files.txt" || true)
              exact_count=$(printf '%s\n' "$exact" | sed '/^$/d' | wc -l)

              if [ "$exact_count" -gt 0 ]; then
                jq -n                   --arg schema "CAPITAL_AI_LINEAR_POST_MERGE_CORRELATION@1"                   --arg mainSha "$MAIN_SHA"                   --argjson mergedPr "$MERGED_PR"                   --argjson targetPr "$number"                   --arg targetBranch "$branch"                   --arg targetHeadSha "$head_sha"                   --argjson exactOverlap "$(printf '%s\n' "$exact" | jq -R -s 'split("\n") | map(select(length > 0))')"                   '{schema:$schema,mainSha:$mainSha,mergedPr:$mergedPr,targetPr:$targetPr,targetBranch:$targetBranch,targetHeadSha:$targetHeadSha,exactOverlap:$exactOverlap,authority:"EVIDENCE_ONLY",mergeAuthority:false,deployAuthority:false}'                   > correlation/selected.json
                echo "pr=$number" >> "$GITHUB_OUTPUT"
                echo "branch=$branch" >> "$GITHUB_OUTPUT"
                echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done

          echo "pr=" >> "$GITHUB_OUTPUT"
          echo "branch=" >> "$GITHUB_OUTPUT"
          echo "head_sha=" >> "$GITHUB_OUTPUT"

      - name: Korrelations-Commit auf bestehendem PR-Branch erzeugen
        if: steps.target.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ steps.target.outputs.pr }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_HEAD: ${{ steps.target.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_head=$(gh api "repos/$REPOSITORY/pulls/$TARGET_PR" --jq '.head.sha')
          test "$current_head" = "$EXPECTED_HEAD"

          git fetch --no-tags origin "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git checkout --detach "$EXPECTED_HEAD"

          mkdir -p docs/evidence
          cp correlation/selected.json docs/evidence/linear-post-merge-correlation.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/linear-post-merge-correlation.json

          if git diff --cached --quiet; then
            echo "Korrelations-Evidence ist bereits identisch; kein Commit nötig."
            exit 0
          fi

          git commit -m "[CAPITAL-AI-TRUST] Post-Merge-Korrelation für PR #$TARGET_PR"
          git push "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Zusammenfassung
        shell: bash
        run: |
          if [ -n "${{ steps.target.outputs.pr }}" ]; then
            echo "Korrelations-Evidence wurde auf PR #${{ steps.target.outputs.pr }} aktualisiert." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Keine exakte Dateikollision mit einem aktiven linearen PR; kein Commit erzeugt." >> "$GITHUB_STEP_SUMMARY"
          fi
