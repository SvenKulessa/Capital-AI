name: PG17 Backup Reader Contract (isolated)

on:
  pull_request:
    paths:
      - 'scripts/platform/backup-reader-contract-test.sh'
      - 'scripts/platform/backup-recovery-slices-test.sh'
      - 'docs/platform/SUPABASE-BACKUP-READER-CONTRACT.md'
      - '.github/workflows/backup-reader-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg17-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-reader-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Bash syntax
        run: |
          bash -n scripts/platform/backup-reader-contract-test.sh
          bash -n scripts/platform/backup-recovery-slices-test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PostgreSQL 17 fixture with layer caching
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/pg17-reader.Dockerfile
          tags: capital-ai-pg17-reader-fixture
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PostgreSQL 17.11 and run isolated two-cluster recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=1024m \
            --tmpfs /var/run/postgresql:rw,nosuid,size=16m \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --pids-limit 150 \
            --memory 2g \
            --cpus 2 \
            --user postgres \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --workdir /repo \
            --entrypoint /bin/bash \
            capital-ai-pg17-reader-fixture \
            -c 'bash scripts/platform/backup-reader-contract-test.sh && bash scripts/platform/backup-recovery-slices-test.sh'
