name: PG17 Backup Reader Contract (isolated)

on:
  pull_request:
    paths:
      - 'scripts/platform/backup-reader-contract-test.sh'
      - 'docs/platform/SUPABASE-BACKUP-READER-CONTRACT.md'
      - '.github/workflows/backup-reader-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg17-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-reader-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Bash syntax
        run: bash -n scripts/platform/backup-reader-contract-test.sh
      - name: Build PostgreSQL 17 fixture with pinned extension sources
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --tag capital-ai-pg17-reader-fixture - <<'DOCKERFILE'
          FROM postgres:17.11-bookworm@sha256:73bedc9eaa0121b92b9b26bb52e5141b3f6f37479c7ef913c0160455763ca80a
          USER root
          ENV DEBIAN_FRONTEND=noninteractive
          RUN set -eux; \
              apt-get update -qq; \
              # Preserve 17.11 server/client from the digest-pinned base while installing build headers. \
              apt-mark hold postgresql-17 postgresql-client-17; \
              apt-get install -y --no-install-recommends \
                ca-certificates git build-essential postgresql-server-dev-17 \
                libcurl4-openssl-dev python3 ripgrep; \
              test "$(/usr/lib/postgresql/17/bin/postgres --version)" = 'postgres (PostgreSQL) 17.11 (Debian 17.11-1.pgdg12+2)' || { /usr/lib/postgresql/17/bin/postgres --version; exit 1; }; \
              git clone https://github.com/supabase/pg_net.git /tmp/pg_net; \
              git -C /tmp/pg_net checkout 698fb055f666366a78c112b0578b0a5652ddbcfa; \
              make -C /tmp/pg_net PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config; \
              make -C /tmp/pg_net PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config install; \
              git clone https://github.com/citusdata/pg_cron.git /tmp/pg_cron; \
              git -C /tmp/pg_cron checkout 9490f9cc9803f75105f2f7d89839a998f011f8d8; \
              make -C /tmp/pg_cron PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config; \
              make -C /tmp/pg_cron PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config install; \
              rm -rf /tmp/pg_net /tmp/pg_cron /var/lib/apt/lists/*
          USER postgres
          DOCKERFILE
      - name: Verify PostgreSQL 17.11 and run isolated two-cluster recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=1024m \
            --tmpfs /var/run/postgresql:rw,nosuid,size=16m \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --pids-limit 150 \
            --memory 2g \
            --cpus 2 \
            --user postgres \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --workdir /repo \
            --entrypoint /bin/bash \
            capital-ai-pg17-reader-fixture \
            scripts/platform/backup-reader-contract-test.sh
