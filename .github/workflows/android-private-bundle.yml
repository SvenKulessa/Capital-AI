name: Android Private Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build private APK and AAB
        working-directory: mobile/android-private
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: capital-ai-private-android
          if-no-files-found: error
          path: |
            mobile/android-private/app/build/outputs/apk/debug/app-debug.apk
            mobile/android-private/app/build/outputs/bundle/release/app-release.aab
