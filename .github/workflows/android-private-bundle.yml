name: Android Private Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Build private APK and AAB
        working-directory: mobile/android-private
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:assembleRelease
          gradle --no-daemon :app:bundleRelease
          sha256sum app/build/outputs/apk/debug/app-debug.apk             app/build/outputs/apk/release/app-release-unsigned.apk             app/build/outputs/bundle/release/app-release.aab | tee app/build/outputs/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capital-ai-private-android
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/android-private/app/build/outputs/apk/debug/app-debug.apk
            mobile/android-private/app/build/outputs/apk/release/app-release-unsigned.apk
            mobile/android-private/app/build/outputs/bundle/release/app-release.aab
            mobile/android-private/app/build/outputs/SHA256SUMS.txt
