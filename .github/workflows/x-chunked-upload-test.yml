name: X Chunked Upload Test

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Template ID (evidence-first-scoring, supabase-rls, codeowners, ...)'
        required: true
        default: 'evidence-first-scoring'
      confirm:
        description: 'Set to true to actually call the X API (DRAFT_ONLY still applies)'
        required: true
        default: 'false'
        type: boolean

jobs:
  test-chunked:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'true' }}
    env:
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/x-review-gate-chunked-media

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Attempt token refresh (in-memory)
        if: env.X_REFRESH_TOKEN != '' && env.X_CLIENT_ID != ''
        run: |
          echo "Attempting X token refresh..."
          node --experimental-strip-types -e '
          import { refreshXAccessToken } from "./src/services/x/xTokenRefresh.ts";
          const r = await refreshXAccessToken();
          console.log("Refreshed. expires_in=", r.expiresIn);
          console.log("NEW_REFRESH_TOKEN (persist this!):", r.refreshToken);
          process.env.X_ACCESS_TOKEN = r.accessToken;
          ' || echo "Refresh skipped or failed – continuing with existing X_ACCESS_TOKEN"

      - name: Run review-gate (chunked upload path)
        run: |
          # Create a minimal test file if no real video is present
          echo "test" > /tmp/test.mp4
          node scripts/growth/review-gate-x-publish.mjs \
            --template ${{ github.event.inputs.template }} \
            --media /tmp/test.mp4 \
            --confirm || true
          echo "Done. Check logs for draft ID or error. Publishing remains blocked."
