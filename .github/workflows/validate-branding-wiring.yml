name: Validate branding asset wiring

on:
  push:
    branches:
      - agent/frontend/brand-assets-wiring-20260930

permissions:
  contents: read

concurrency:
  group: branding-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'SvenKulessa/Capital-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Branding- und Docker-Kontext-Regression
        run: node --test scripts/branding-assets.test.mjs scripts/docker-context.test.mjs
      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript, Contracts und Produktionsbuild
        run: |
          npm run lint
          npm test
          npm run build
          node scripts/verify-browser-boundary.mjs
      - name: Build-Output auf Branding-Projektion prüfen
        run: |
          set -euo pipefail
          test -f dist/branding/asset-pack/favicon/favicon.svg
          test -f dist/branding/asset-pack/favicon/site.webmanifest
          test -f dist/branding/asset-pack/social/open-graph-1200x630.jpg
          test -f dist/branding/asset-pack/vendor/google-oauth-app-logo-120x120.png
          grep -F '/branding/asset-pack/favicon/site.webmanifest' dist/index.html
          grep -F 'https://capital-ai.online/branding/asset-pack/social/open-graph-1200x630.jpg' dist/index.html
