# CAPITAL_AI_GITHUB_GOOGLE_OIDC_READBACK@2
# Keyless provider access; manually dispatched from main; no service-account JSON.
name: Google Readback (readonly)
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Choose independently verifiable read plane'
        required: true
        default: ga4
        type: choice
        options:
          - ga4
          - gsc
          - all
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-readback-readonly
  cancel-in-progress: false
jobs:
  google-readback:
    if: github.repository == 'SvenKulessa/Capital-AI' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate the exact keyless identity configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_GOOGLE_READER_SERVICE_ACCOUNT }}
          GA4_ID: ${{ vars.GA4_PROPERTY_ID }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET" == ga4 || "$TARGET" == gsc || "$TARGET" == all ]] || { echo 'INVALID_TARGET'; exit 1; }
          [[ "$PROVIDER" == projects/542877602707/locations/global/workloadIdentityPools/capital-ai-github-read/providers/capital-ai-dispatch ]] || { echo 'GCP_WORKLOAD_IDENTITY_PROVIDER_MISSING_OR_UNEXPECTED'; exit 1; }
          [[ "$SERVICE_ACCOUNT" == capital-ai-google-audit@aifinancial-500208.iam.gserviceaccount.com ]] || { echo 'GCP_GOOGLE_READER_SERVICE_ACCOUNT_MISSING_OR_UNEXPECTED'; exit 1; }
          if [[ "$TARGET" != gsc ]]; then
            [[ "$GA4_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo 'GA4_PROPERTY_ID_MISSING_OR_INVALID: use a numeric ID, not G-...'; exit 1; }
          fi
          echo 'OIDC configuration structure VERIFIED (Google access not yet verified)'
      - id: google_auth
        name: Exchange GitHub OIDC for a short-lived Google token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3 pinned
        with:
          project_id: aifinancial-500208
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GOOGLE_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: |
            https://www.googleapis.com/auth/analytics.readonly
            https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: GA4 property, realtime, and last-seven-days readback
        if: inputs.target == 'ga4' || inputs.target == 'all'
        env:
          GOOGLE_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          GA4_ID: ${{ vars.GA4_PROPERTY_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          test -n "$GOOGLE_TOKEN" || { echo 'OIDC_TOKEN_EMPTY'; exit 1; }
          call_google() {
            local label="$1" method="$2" url="$3" dest="$4" body="${5:-}" status
            if [[ "$method" == POST ]]; then
              status="$(curl -sS --max-time 30 -X POST -H "Authorization: Bearer $GOOGLE_TOKEN" -H 'Content-Type: application/json' --data "$body" -o "$dest" -w '%{http_code}' "$url")"
            else
              status="$(curl -sS --max-time 30 -H "Authorization: Bearer $GOOGLE_TOKEN" -o "$dest" -w '%{http_code}' "$url")"
            fi
            echo "$label HTTP: $status"
            if [[ "$status" != 200 ]]; then
              jq -c '{code:.error.code,status:.error.status}' "$dest" || true
              return 1
            fi
          }
          call_google 'GA4 properties.get' GET "https://analyticsadmin.googleapis.com/v1beta/properties/$GA4_ID" "$tmp/property.json"
          jq -e --arg p "properties/$GA4_ID" '.name==$p' "$tmp/property.json" >/dev/null || { echo 'GA4_PROPERTY_IDENTITY_MISMATCH'; exit 1; }
          echo 'GA4 exact property identity VERIFIED'
          call_google 'GA4 runRealtimeReport' POST "https://analyticsdata.googleapis.com/v1beta/properties/$GA4_ID:runRealtimeReport" "$tmp/realtime.json" '{"dimensions":[{"name":"eventName"}],"metrics":[{"name":"eventCount"}],"limit":"25"}'
          jq -e '(.rows==null or (.rows|type=="array"))' "$tmp/realtime.json" >/dev/null || { echo 'GA4_REALTIME_SCHEMA_INVALID'; exit 1; }
          echo 'GA4 realtime query authenticated (event data redacted)'
          call_google 'GA4 runReport last seven days' POST "https://analyticsdata.googleapis.com/v1beta/properties/$GA4_ID:runReport" "$tmp/sevendays.json" '{"dateRanges":[{"startDate":"7daysAgo","endDate":"today"}],"dimensions":[{"name":"eventName"}],"metrics":[{"name":"eventCount"}],"limit":"25"}'
          jq -e '(.rows==null or (.rows|type=="array"))' "$tmp/sevendays.json" >/dev/null || { echo 'GA4_SEVENDAYS_SCHEMA_INVALID'; exit 1; }
          echo 'GA4 seven-day query authenticated (event data redacted)'
          echo 'GA4_PROVIDER_READ_VERIFIED for GitHub OIDC identity only'
      - name: GSC property and sitemaps readback
        if: inputs.target == 'gsc' || inputs.target == 'all'
        env:
          GOOGLE_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          test -n "$GOOGLE_TOKEN" || { echo 'OIDC_TOKEN_EMPTY'; exit 1; }
          read_gsc() {
            local label="$1" url="$2" file="$3" status
            status="$(curl -sS --max-time 30 -H "Authorization: Bearer $GOOGLE_TOKEN" -o "$file" -w '%{http_code}' "$url")"
            echo "$label HTTP: $status"
            if [[ "$status" != 200 ]]; then
              jq -c '{code:.error.code,status:.error.status}' "$file" || true
              return 1
            fi
          }
          read_gsc 'GSC sites.list' 'https://www.googleapis.com/webmasters/v3/sites' "$tmp/sites.json"
          jq -e '[.siteEntry[]? | select(.siteUrl=="sc-domain:capital-ai.online" and (.permissionLevel|IN("siteOwner","siteFullUser","siteRestrictedUser")))] | length==1' "$tmp/sites.json" >/dev/null || { echo 'GSC_EXACT_PROPERTY_PERMISSION_UNVERIFIED'; exit 1; }
          echo 'GSC exact property verified'
          read_gsc 'GSC sitemaps.list' 'https://www.googleapis.com/webmasters/v3/sites/sc-domain%3Acapital-ai.online/sitemaps' "$tmp/sitemaps.json"
          jq -e '(.sitemap == null or (.sitemap|type=="array"))' "$tmp/sitemaps.json" >/dev/null || { echo 'GSC_SITEMAPS_SCHEMA_INVALID'; exit 1; }
          echo 'GSC sitemaps readable (counts redacted)'
          echo 'GSC_PROVIDER_READ_VERIFIED for GitHub OIDC identity only'
