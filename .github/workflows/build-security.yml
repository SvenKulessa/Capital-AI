name: Docker Build Sicherheit
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Geprüftes Image als nicht deploybaren GHCR-Kandidaten veröffentlichen (nur Main)
        type: boolean
        default: false
      verify_production_handoff:
        description: Nach Kandidaten-Publish Main-Schutz, Render-Digest und Runtime-Identität fail-closed verifizieren
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docker-security-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'release' || 'validation' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  validate:
    name: Docker Security Gate
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      image_id: ${{ steps.image_identity.outputs.image_id }}
      candidate_artifact_digest: ${{ steps.candidate_archive.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI-, Merge- und Laufzeitidentität explizit binden
        env:
          CAPITAL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CAPITAL_BASE_MAIN_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p security-reports
          node scripts/container-evidence-identity.mjs init security-reports/container-identity.json
          node scripts/write-runtime-identity.mjs "$GITHUB_SHA"
      - name: npm-Lizenzmetadaten und Regressionstests prüfen
        run: |
          node scripts/preflight.mjs
          node --test scripts/verify-go-vuln-reachability.test.mjs scripts/docker-archive-config.test.mjs
      - name: Gepinnte Sicherheitswerkzeuge bauen
        run: |
          docker build --file Dockerfile.security --tag capital-ai-security .
          mkdir -p security-reports
          docker run --rm capital-ai-security --version | tee security-reports/trivy-version.txt
          test "$(sed -n 's/^Version: //p' security-reports/trivy-version.txt | head -n1)" = "0.75.0"
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          chmod a+rwx "$RUNNER_TEMP/trivy-cache"
      - name: Dockerfile linten
        run: |
          docker run --rm --entrypoint hadolint -v "$PWD:/work:ro" capital-ai-security /work/Dockerfile
          # Disk bootstrap drops to UID 1000; its bounded exception remains source-scanned.
          docker run --rm --entrypoint hadolint -v "$PWD:/work:ro" capital-ai-security --ignore DL3002 /work/deploy/Dockerfile.nats
      - name: NATS-Disk-Bootstrap und nicht-root Server verifizieren
        run: |
          mkdir -p security-reports
          docker build --file deploy/Dockerfile.nats --tag capital-nats:${{ github.sha }} .
          bash scripts/verify-nats-runtime.sh
          docker image inspect capital-nats:${{ github.sha }} > security-reports/nats-image-identity.json
          docker save capital-nats:${{ github.sha }} --output security-reports/nats-image.tar
          chmod a+r security-reports/nats-image.tar
          chmod a+rwx security-reports
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/nats-image.tar --ignorefile /dev/null --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 --format json --output /reports/nats-image.json
          node scripts/summarize-trivy.mjs security-reports/nats-image.json > security-reports/nats-image.summary.json
          node scripts/summarize-trivy.mjs security-reports/nats-image.json --gate
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/nats-image.tar --ignorefile /dev/null --scanners vuln --format cyclonedx --output /reports/nats.sbom.cdx.json

          # GO-2026-5932: exact binary evidence; no scanner suppression and no NATS redeploy.
          nats_base_ref=$(awk '/^FROM nats:/{print $2; exit}' deploy/Dockerfile.nats)
          [[ "$nats_base_ref" =~ ^nats:[^@]+@sha256:[0-9a-f]{64}$ ]]
          nats_local_id=$(docker image inspect --format '{{.Id}}' capital-nats:${{ github.sha }})
          [[ "$nats_local_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          nats_binary_path=$(docker run --rm --entrypoint sh capital-nats:${{ github.sha }} -c 'command -v nats-server')
          test -n "$nats_binary_path"
          nats_container=$(docker create --entrypoint sh capital-nats:${{ github.sha }} -c true)
          trap 'docker rm -f "$nats_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$nats_container:$nats_binary_path" security-reports/nats-server
          docker rm -f "$nats_container" >/dev/null
          trap - EXIT
          nats_binary_sha="sha256:$(sha256sum security-reports/nats-server | cut -d ' ' -f 1)"
          jq -n --arg baseImageRef "$nats_base_ref" --arg localImageId "$nats_local_id" --arg binaryPath "$nats_binary_path" --arg binarySha256 "$nats_binary_sha" \
            '{schemaVersion:1,baseImageRef:$baseImageRef,localImageId:$localImageId,binaryPath:$binaryPath,binarySha256:$binarySha256}' \
            > security-reports/nats-reachability-image-identity.json

          for reachability_run in 1 2; do
            docker run --rm -e GOTOOLCHAIN=local -e GOVULNCHECK_VERSION=v1.8.0 -e REACHABILITY_RUN="$reachability_run" -v "$PWD/security-reports:/evidence" golang:1.26.8-alpine@sha256:6e5de3f5b9fb7e30b8bb2ffe8dcbcbdaa2990f0f31267456eabe83f870a623be sh -euc '
              GOBIN=/tmp/gobin go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
              go version -m /evidence/nats-server > "/evidence/nats-go-version-m-$REACHABILITY_RUN.txt"
              set +e
              go tool nm /evidence/nats-server > "/evidence/nats-nm-$REACHABILITY_RUN.txt" 2>"/evidence/nats-nm-$REACHABILITY_RUN.stderr.txt"
              printf "%s\n" "$?" > "/evidence/nats-nm-$REACHABILITY_RUN.status.txt"
              set -e
              set +e
              /tmp/gobin/govulncheck -mode binary -json /evidence/nats-server > "/evidence/nats-govulncheck-$REACHABILITY_RUN.raw.json"
              printf "%s\n" "$?" > "/evidence/nats-govulncheck-$REACHABILITY_RUN.status.txt"
              /tmp/gobin/govulncheck -mode binary -format openvex /evidence/nats-server > "/evidence/nats-govulncheck-$REACHABILITY_RUN.openvex.json"
              printf "%s\n" "$?" > "/evidence/nats-govulncheck-$REACHABILITY_RUN.openvex.status.txt"
              set -e
            '
            jq -s '.' "security-reports/nats-govulncheck-$reachability_run.raw.json" > "security-reports/nats-govulncheck-$reachability_run.messages.json"
          done

          reproducible=false
          if cmp -s security-reports/nats-go-version-m-1.txt security-reports/nats-go-version-m-2.txt \
            && cmp -s security-reports/nats-nm-1.txt security-reports/nats-nm-2.txt \
            && diff -u <(jq -S '[.[] | select(.progress | not)]' security-reports/nats-govulncheck-1.messages.json) <(jq -S '[.[] | select(.progress | not)]' security-reports/nats-govulncheck-2.messages.json) >/dev/null \
            && diff -u <(jq -S '.statements' security-reports/nats-govulncheck-1.openvex.json) <(jq -S '.statements' security-reports/nats-govulncheck-2.openvex.json) >/dev/null; then
            reproducible=true
          fi
          printf "%s\n" "$reproducible" > security-reports/nats-reachability-reproducible.txt

          export NATS_BINARY_SHA256="$nats_binary_sha"
          export NATS_IMAGE_REF="$nats_base_ref"
          export NATS_LOCAL_IMAGE_ID="$nats_local_id"
          node scripts/verify-go-vuln-reachability.mjs \
            security-reports/nats-govulncheck-1.messages.json \
            security-reports/nats-govulncheck-1.openvex.json \
            security-reports/nats-go-version-m-1.txt \
            security-reports/nats-nm-1.txt \
            security-reports/nats-nm-1.status.txt \
            security-reports/nats-reachability-reproducible.txt \
            security-reports/nats-go-2026-5932-reachability.json \
            security-reports/nats-go-2026-5932.openvex.json \
            security-reports/nats-go-2026-5932.cdx.vex.json

          rm security-reports/nats-image.tar security-reports/nats-server
      - name: Quellcode, Secrets und Konfiguration scannen
        run: |
          mkdir -p security-reports
          chmod a+rwx security-reports
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -w /work -v "$PWD:/work:ro" -v "$PWD/security-reports:/reports" capital-ai-security fs --skip-dirs /work/security-reports --include-dev-deps --ignorefile /work/deploy/trivy-bootstrap-exception.yaml --scanners vuln,secret,misconfig --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --output /reports/source.json --exit-code 0 /work
          node scripts/summarize-trivy.mjs security-reports/source.json --gate
      - name: Build-Stufe nach Entfernung des Installationswerkzeugs scannen
        run: |
          docker build --pull --target build --tag capital-ai-build:${{ github.sha }} .
          mkdir -p security-reports
          docker save capital-ai-build:${{ github.sha }} -o security-reports/build.tar
          chmod a+r security-reports/build.tar
          chmod a+rwx security-reports
          scan_status=0
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/build.tar --ignorefile /dev/null --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --output /reports/build-image.json --exit-code 0 || scan_status=$?
          node scripts/summarize-trivy.mjs security-reports/build-image.json > security-reports/build-image.summary.json
          node scripts/summarize-trivy.mjs security-reports/build-image.json --gate || build_gate_status=$?
          # Only diagnose actual Go HIGH findings. Unrelated CVEs must fail at their own gate.
          if [ "${build_gate_status:-0}" -ne 0 ] && jq -e '.vulnerabilities | any(.severity == "HIGH" and (.package == "stdlib" or .package == "golang.org/x/text"))' security-reports/build-image.summary.json >/dev/null; then
            container_id=$(docker create capital-ai-build:${{ github.sha }})
            trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
            docker cp "$container_id:/app/node_modules/@typescript/typescript-linux-x64/lib/tsc" security-reports/ts7-compiler
            binary_sha=$(sha256sum security-reports/ts7-compiler | cut -d ' ' -f 1)
            export TS7_BINARY_SHA256="sha256:$binary_sha"
            docker run --rm -e GOTOOLCHAIN=local -e GOVULNCHECK_VERSION=v1.8.0 -v "$PWD/security-reports:/evidence" golang:1.26.8-alpine@sha256:6e5de3f5b9fb7e30b8bb2ffe8dcbcbdaa2990f0f31267456eabe83f870a623be sh -euc '
              GOBIN=/tmp/gobin go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
              go version -m /evidence/ts7-compiler > /evidence/ts7-go-version-m.txt
              /tmp/gobin/govulncheck -mode binary -json /evidence/ts7-compiler > /evidence/ts7-govulncheck.raw.json
              /tmp/gobin/govulncheck -mode binary -format openvex /evidence/ts7-compiler > /evidence/ts7-govulncheck.openvex.json
            '
            jq -s '.' security-reports/ts7-govulncheck.raw.json > security-reports/ts7-govulncheck.messages.json
            node scripts/verify-ts7-compiler-reachability.mjs security-reports/ts7-govulncheck.messages.json security-reports/ts7-govulncheck.openvex.json security-reports/ts7-go-version-m.txt security-reports/build-image.summary.json security-reports/ts7-compiler-reachability.json
          fi
          if [ "$scan_status" -ne 0 ]; then exit "$scan_status"; fi
          if [ "${build_gate_status:-0}" -ne 0 ]; then exit "$build_gate_status"; fi
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/build.tar --ignorefile /dev/null --scanners license --license-full --format json --output /reports/build-image-licenses.json --exit-code 0
          rm security-reports/build.tar
      - name: Image mit Tests und isoliertem Frontend-Build bauen
        run: docker build --pull --tag capital-ai:${{ github.sha }} .
      - name: SEO-Contract real ausführen
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/package.json:/app/package.json:ro" \
            -v "$PWD/index.html:/app/index.html:ro" \
            -v "$PWD/server:/app/server:ro" \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/shared:/app/shared:ro" \
            --entrypoint node capital-ai:${{ github.sha }} --run test:seo
      - name: Server-Regressionstests
        run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges -v "$PWD/server:/app/server:ro" -v "$PWD/supabase/migrations:/app/supabase/migrations:ro" --entrypoint node capital-ai:${{ github.sha }} --test /app/server/market.test.mjs /app/server/market-contracts.test.mjs /app/server/security.test.mjs /app/server/auth.test.mjs /app/server/user-provider-vault.test.mjs /app/server/infrastructure-security.test.mjs /app/server/seo-indexing-policy.test.mjs /app/server/well-known.test.mjs
      - name: 600-Asset-Scoring-Kapazitätsevidence übernehmen
        run: |
          mkdir -p security-reports
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint cat capital-ai:${{ github.sha }} /app/evidence/scoring-capacity.json > security-reports/scoring-capacity.json
          jq -e '.scope == "ENGINE_CAPACITY_ONLY" and .totalConcurrent == 600 and .failed == 0 and ([.assetClasses[] | select(.succeeded >= 100)] | length == 6) and .productionEligible == false' security-reports/scoring-capacity.json >/dev/null
      - name: Exaktes Image exportieren und scannen
        id: image_identity
        run: |
          mkdir -p security-reports
          docker save capital-ai:${{ github.sha }} -o security-reports/image.tar
          node scripts/docker-archive-config.mjs security-reports/image.tar > security-reports/image-id.txt
          echo "image_id=$(cat security-reports/image-id.txt)" >> "$GITHUB_OUTPUT"
          node scripts/container-evidence-identity.mjs set security-reports/container-identity.json localImageId "$(cat security-reports/image-id.txt)"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint cat capital-ai:${{ github.sha }} /app/dist/THIRD_PARTY_NOTICES.txt > security-reports/THIRD_PARTY_NOTICES.txt
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint cat capital-ai:${{ github.sha }} /app/dist/frontend-license-inventory.json > security-reports/frontend-license-inventory.json
          chmod a+r security-reports/image.tar
          chmod a+rwx security-reports
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/image.tar --ignorefile /dev/null --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --output /reports/image.json --exit-code 0
          node scripts/summarize-trivy.mjs security-reports/image.json --gate
      - name: SBOM des exportierten Images
        if: always() && hashFiles('security-reports/image.tar') != ''
        run: |
          test -f security-reports/image.tar
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/image.tar --ignorefile /dev/null --scanners vuln --format cyclonedx --output /reports/capital-ai.sbom.cdx.json
      - name: Runtime-Lizenzinventar am exportierten Image
        if: always() && hashFiles('security-reports/image.tar') != ''
        run: docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/image.tar --ignorefile /dev/null --scanners license --license-full --format json --output /reports/image-licenses.json --exit-code 0
      - name: Runtime ohne Schreibrechte und Linux-Capabilities prüfen
        run: |
          docker run -d --name capital-ai-smoke --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:10000:10000 capital-ai:${{ github.sha }}
          cleanup() {
            result=$?
            docker inspect --format '{{json .State}}' capital-ai-smoke > security-reports/smoke-state.json || true
            docker logs capital-ai-smoke > security-reports/smoke.log 2>&1 || true
            docker rm -f capital-ai-smoke || true
            exit "$result"
          }
          trap cleanup EXIT
          curl --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 --retry-max-time 30 --connect-timeout 2 --max-time 3 --fail --output security-reports/smoke-health.json http://127.0.0.1:10000/healthz
          test "$(docker exec capital-ai-smoke id -u)" = 1000
          docker exec capital-ai-smoke sh -c 'test ! -w /app/server/index.mjs && ! command -v npm'
      - name: Bereinigte Scan-Ergebnisse öffentlich zusammenfassen
        if: always()
        run: |
          mkdir -p security-reports
          node scripts/publish-security-summary.mjs security-reports
      - name: Prüfnachweise sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-security-${{ github.sha }}
          path: |
            security-reports/*.public.json
            security-reports/*.sbom.cdx.json
            security-reports/*-licenses.json
            security-reports/*-identity.json
            security-reports/frontend-license-inventory.json
            security-reports/smoke-health.json
            security-reports/smoke-state.json
            security-reports/image-id.txt
            security-reports/THIRD_PARTY_NOTICES.txt
            security-reports/trivy-version.txt
            security-reports/smoke.log
            security-reports/nats-smoke.log
            security-reports/nats-image.summary.json
            security-reports/nats-reachability-image-identity.json
            security-reports/nats-go-2026-5932-reachability.json
            security-reports/nats-govulncheck-1.openvex.json
            security-reports/nats-go-2026-5932.openvex.json
            security-reports/nats-go-2026-5932.cdx.vex.json
            security-reports/nats-go-version-m-1.txt
            security-reports/nats-nm-1.status.txt
            security-reports/nats-reachability-reproducible.txt
            security-reports/ts7-compiler-reachability.json
            security-reports/scoring-capacity.json
            security-reports/ts7-govulncheck.openvex.json
            security-reports/ts7-go-version-m.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Dasselbe geprüfte Image zur Veröffentlichung übergeben
        id: candidate_archive
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_candidate && github.ref == 'refs/heads/main' && github.repository == 'SvenKulessa/Capital-AI'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            security-reports/image.tar
            security-reports/container-identity.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish_candidate:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate && github.ref == 'refs/heads/main' && github.repository == 'SvenKulessa/Capital-AI'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      image_ref: ${{ steps.registry.outputs.image_ref }}
      digest: ${{ steps.registry.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_REPOSITORY: ghcr.io/svenkulessa/capital-ai
      EXPECTED_IMAGE_ID: ${{ needs.validate.outputs.image_id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.validate.outputs.candidate_artifact_digest }}
      SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aktuellen Main vor Veröffentlichung korrelieren
        run: |
          set -euo pipefail
          test "$(gh api repos/SvenKulessa/Capital-AI/branches/main --jq .commit.sha)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          digest-mismatch: error
      - name: Geprüftes Artefakt laden (kein erneuter Anwendungsbuild)
        run: |
          set -euo pipefail
          docker load --input candidate/image.tar
          docker save "capital-ai:$SOURCE_SHA" --output candidate/loaded-image.tar
          test "$(node scripts/docker-archive-config.mjs candidate/loaded-image.tar)" = "$EXPECTED_IMAGE_ID"
          rm candidate/loaded-image.tar
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "capital-ai:$SOURCE_SHA")" = linux/amd64
          docker build --file Dockerfile.security --tag capital-ai-security .
          mkdir -p security-reports
          test -f candidate/container-identity.json
          cp candidate/container-identity.json security-reports/container-identity.json
          node scripts/container-evidence-identity.mjs set security-reports/container-identity.json artifactArchiveDigest "$CANDIDATE_ARTIFACT_DIGEST"
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          chmod a+rwx "$RUNNER_TEMP/trivy-cache"
          rm candidate/image.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Kandidat pushen und Manifest-Digest aus Registry lesen
        id: registry
        run: |
          set -euo pipefail
          candidate_tag="$IMAGE_REPOSITORY:candidate-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "capital-ai:$SOURCE_SHA" "$candidate_tag"
          docker push "$candidate_tag"
          mkdir -p security-reports
          docker buildx imagetools inspect "$candidate_tag" --format '{{json .Manifest}}' > security-reports/registry-manifest.json
          registry_digest=$(jq -er '.digest | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' security-reports/registry-manifest.json)
          image_ref="$IMAGE_REPOSITORY@$registry_digest"
          [[ "$image_ref" =~ ^ghcr\.io/svenkulessa/capital-ai@sha256:[a-f0-9]{64}$ ]]
          platform_digest=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("Expected one linux/amd64 manifest") end' security-reports/registry-manifest.json)
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$platform_digest" --raw > security-reports/registry-platform-manifest.json
          test "sha256:$(sha256sum security-reports/registry-platform-manifest.json | cut -d ' ' -f 1)" = "$platform_digest"
          docker pull "$image_ref"
          config_digest=$(jq -er '.config.digest | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' security-reports/registry-platform-manifest.json)
          test "$config_digest" = "$EXPECTED_IMAGE_ID"
          node scripts/container-evidence-identity.mjs set security-reports/container-identity.json \
            ociIndexDigest "$registry_digest" \
            platformManifestDigest "$platform_digest" \
            configDigest "$config_digest"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "digest=${image_ref##*@}" >> "$GITHUB_OUTPUT"
      - name: Registry-Image per Digest erneut scannen und SBOM erzeugen
        env:
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
        run: |
          set -euo pipefail
          mkdir -p security-reports
          docker save "$IMAGE_REF" --output security-reports/registry-image.tar
          test "$(node scripts/docker-archive-config.mjs security-reports/registry-image.tar)" = "$EXPECTED_IMAGE_ID"
          chmod a+r security-reports/registry-image.tar
          chmod a+rwx security-reports
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/registry-image.tar --ignorefile /dev/null --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output /reports/registry-image.json
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/registry-image.tar --ignorefile /dev/null --scanners vuln --format cyclonedx --output /reports/capital-ai.sbom.cdx.json
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy" -v "$PWD/security-reports:/reports" capital-ai-security image --input /reports/registry-image.tar --ignorefile /dev/null --scanners license --license-full --format json --output /reports/registry-image-licenses.json --exit-code 0
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint cat "$IMAGE_REF" /app/dist/THIRD_PARTY_NOTICES.txt > security-reports/THIRD_PARTY_NOTICES.txt
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint cat "$IMAGE_REF" /app/dist/frontend-license-inventory.json > security-reports/frontend-license-inventory.json
          rm security-reports/registry-image.tar
      - name: Build-Provenance an exakten Registry-Digest binden
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/svenkulessa/capital-ai
          subject-digest: ${{ steps.registry.outputs.digest }}
          push-to-registry: true
      - name: SBOM an denselben Registry-Digest binden
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/svenkulessa/capital-ai
          subject-digest: ${{ steps.registry.outputs.digest }}
          sbom-path: security-reports/capital-ai.sbom.cdx.json
          push-to-registry: true
      - name: Beide Attestations gegen Workflow und Quellcommit verifizieren
        env:
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
        run: |
          set -euo pipefail
          identity_args=(--repo SvenKulessa/Capital-AI --signer-workflow SvenKulessa/Capital-AI/.github/workflows/build-security.yml --source-digest "$SOURCE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          gh attestation verify "oci://$IMAGE_REF" "${identity_args[@]}" > security-reports/provenance-verification.json
          gh attestation verify "oci://$IMAGE_REF" "${identity_args[@]}" --predicate-type https://cyclonedx.org/bom > security-reports/sbom-verification.json
          test "$(gh api repos/SvenKulessa/Capital-AI/branches/main --jq .commit.sha)" = "$SOURCE_SHA"
          jq -n --slurpfile identity security-reports/container-identity.json --arg sha "$SOURCE_SHA" --arg image "$IMAGE_REF" --arg imageId "$EXPECTED_IMAGE_ID" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" '{schemaVersion:2,status:"ATTESTED_CANDIDATE",deployEligible:false,sourceSha:$sha,imageRef:$image,localImageId:$imageId,containerIdentity:$identity[0],workflowRun:$run,remainingGates:["LICENSE_REDISTRIBUTION_REVIEW","MAIN_PROTECTION","CONTAINER_IDENTITY_CHAIN","RENDER_IMAGE_SOURCE","RUNTIME_DIGEST","RUNTIME_IDENTITY"]}' > security-reports/candidate.json
      - name: Kandidaten-Nachweise sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            security-reports/*.json
            security-reports/THIRD_PARTY_NOTICES.txt
          if-no-files-found: warn
          retention-days: 7

  production_handoff:
    name: Production Handoff Gate
    needs: publish_candidate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate && inputs.verify_production_handoff && github.ref == 'refs/heads/main' && github.repository == 'SvenKulessa/Capital-AI'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      IMAGE_REF: ${{ needs.publish_candidate.outputs.image_ref }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_TEST }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_TEST }}
      RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID_TEST }}
      RENDER_OWNER_ID: tea-d90o4rj7uimc739i86ug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghcr-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          digest-mismatch: error
      - name: Main-Schutz und Provider-Authority lesen
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          test "$RENDER_WORKSPACE_ID" = "$RENDER_OWNER_ID"
          test "$RENDER_SERVICE_ID" != "srv-d91o1o9o3t8c73edi55g"
          test "$(gh api repos/SvenKulessa/Capital-AI/branches/main --jq .commit.sha)" = "$SOURCE_SHA"
          mkdir -p security-reports
          gh api repos/SvenKulessa/Capital-AI/rulesets --jq '.[].id' > security-reports/ruleset-ids.txt
          : > security-reports/main-rulesets.ndjson
          while IFS= read -r id; do
            test -z "$id" || gh api "repos/SvenKulessa/Capital-AI/rulesets/$id" >> security-reports/main-rulesets.ndjson
          done < security-reports/ruleset-ids.txt
          if test -s security-reports/main-rulesets.ndjson; then
            jq -s '.' security-reports/main-rulesets.ndjson > security-reports/main-rulesets.json
          else
            printf '[]\n' > security-reports/main-rulesets.json
          fi
      - name: Render Image-Quelle, Live-Deploy und Health lesen
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer $RENDER_API_KEY"
          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID" > security-reports/render-service.json
          jq -e --arg id "$RENDER_SERVICE_ID" --arg owner "$RENDER_OWNER_ID" '.id == $id and .ownerId == $owner and .type == "web_service"' security-reports/render-service.json >/dev/null
          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" > security-reports/render-deploys.json
          jq -e '[.[] | (.deploy // .) | select(.status == "live")] | if length == 1 then .[0] else error("Expected exactly one live deploy") end' security-reports/render-deploys.json > security-reports/render-live-deploy.json
          candidate_identity=$(find candidate -name container-identity.json -type f -print -quit)
          test -n "$candidate_identity"
          cp "$candidate_identity" security-reports/container-identity.json
          runtime_provider_digest=$(jq -er '.image.sha | select(type == "string")' security-reports/render-live-deploy.json)
          node scripts/container-evidence-identity.mjs set security-reports/container-identity.json runtimeProviderDigest "$runtime_provider_digest"
          service_url=$(jq -er '.serviceDetails.url | select(type == "string" and startswith("https://"))' security-reports/render-service.json)
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 3 --max-time 8 "$service_url/healthz" > security-reports/render-health.json
      - name: Fehlende zusätzliche Analyse-Evidence fail-closed kennzeichnen
        run: printf '[]\n' > security-reports/analysis-results.json
      - name: Production-Handoff-Gates korrelieren
        run: |
          set -euo pipefail
          candidate_file=$(find candidate -name candidate.json -type f -print -quit)
          test -n "$candidate_file"
          EXPECTED_RENDER_SERVICE_ID="$RENDER_SERVICE_ID" EXPECTED_RENDER_OWNER_ID="$RENDER_OWNER_ID" EXPECTED_MAIN_SHA="$SOURCE_SHA" node scripts/verify-production-handoff.mjs \
            "$candidate_file" \
            docs/security/evidence/license-rights-review.json \
            security-reports/main-rulesets.json \
            security-reports/render-service.json \
            security-reports/render-live-deploy.json \
            security-reports/render-health.json \
            security-reports/release.json \
            candidate/registry-manifest.json \
            candidate/registry-image.json \
            security-reports/analysis-results.json \
            candidate/registry-platform-manifest.json
      - name: Production-Handoff-Nachweise sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/*.json
          if-no-files-found: warn
          retention-days: 14
