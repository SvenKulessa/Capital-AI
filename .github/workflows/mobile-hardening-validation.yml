name: Mobile Hardening Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Dependencies deterministic installieren
        run: npm ci --ignore-scripts
      - name: Mobile OIDC und Universe Unit Tests
        run: node --test server/auth.test.mjs server/mobile-scorer.test.mjs
      - name: Live Top-400 Research Universe prüfen
        run: |
          set -euo pipefail
          mkdir -p security-reports
          MOBILE_CRYPTO_COINPAPRIKA_RESEARCH=true node --input-type=module <<'NODE' | tee security-reports/mobile-top400-live.json
          import { loadUniverseForEvidence } from './server/mobile-scorer.mjs';
          const universe = await loadUniverseForEvidence({ MOBILE_CRYPTO_COINPAPRIKA_RESEARCH: 'true' });
          const evidence = {
            schema: 'MOBILE_TOP400_RUNTIME@1',
            status: universe.status,
            requested: universe.requested,
            count: universe.count,
            sources: universe.sources,
            rankMetrics: universe.rankMetrics,
            rightsScope: universe.rightsScope,
            uniqueSymbols: new Set(universe.assets.map(x => x.symbol)).size,
            firstRank: universe.assets[0]?.universeRank ?? null,
            lastRank: universe.assets.at(-1)?.universeRank ?? null,
          };
          console.log(JSON.stringify(evidence, null, 2));
          const ranks = universe.assets.map(x => x.universeRank).filter(Number.isInteger);
          const monotonic = ranks.every((rank, index) => index === 0 || rank >= ranks[index - 1]);
          if (evidence.status !== 'READY' || evidence.count !== 400 || evidence.uniqueSymbols !== 400 || evidence.firstRank !== 1 || !monotonic || evidence.lastRank < 400) process.exit(1);
          NODE
      - name: Kanonische Scorer Authority per HTTP Contract verifizieren
        if: always()
        run: |
          set -euo pipefail
          mkdir -p security-reports
          probe() {
            local url="$1"
            curl --silent --show-error --location-trusted --max-redirs 0 --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 4 --max-time 20               -o /tmp/probe-body -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data '{}'
          }
          public_status="$(probe 'https://capital-ai.online/api/crypto/score' || true)"
          finance_status="$(probe 'https://finance-7clq.onrender.com/api/crypto/score' || true)"
          capital_status="$(probe 'https://capital-ai-uvsl.onrender.com/api/crypto/score' || true)"
          jq -n --arg public "$public_status" --arg finance "$finance_status" --arg capital "$capital_status"             '{schema:"MOBILE_SCORER_ORIGIN_READBACK@2",publicOrigin:"https://capital-ai.online",publicStatus:$public,financeRenderOrigin:"https://finance-7clq.onrender.com",financeRenderStatus:$finance,capitalRenderOrigin:"https://capital-ai-uvsl.onrender.com",capitalRenderStatus:$capital,verified:(["400","401","402","403","409","422","429"] | index($public) != null)}'             | tee security-reports/mobile-scorer-origin.json
          jq -e '.verified == true' security-reports/mobile-scorer-origin.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mobile-hardening-evidence
          retention-days: 14
          if-no-files-found: warn
          path: security-reports/*.json
