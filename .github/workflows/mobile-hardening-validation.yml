name: Mobile Hardening Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-26.04
    outputs:
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      - name: Mobile-/OIDC-/Scorer-Scope erkennen
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > /tmp/mobile-files.txt
          if grep -Eq '^(mobile/|server/(auth|auth\.test|mobile-scorer|mobile-scorer\.test|scorer-proxy|scorer-proxy\.test|open-source-market-policy|index)\.mjs$|docs/market-data/open-source-market-policy\.json$|package-lock\.json$)' /tmp/mobile-files.txt; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          elif grep -qx 'package.json' /tmp/mobile-files.txt; then
            # Script-only registration does not change mobile dependency closure.
            # Other manifest changes remain conservatively in scope.
            gh api "repos/$REPOSITORY/contents/package.json?ref=$BASE_SHA" --jq '.content' | base64 --decode > /tmp/mobile-package-base.json
            gh api "repos/$REPOSITORY/contents/package.json?ref=$HEAD_SHA" --jq '.content' | base64 --decode > /tmp/mobile-package-head.json
            node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const read = file => {
            const manifest = JSON.parse(readFileSync(file, 'utf8'));
            delete manifest.scripts;
            return manifest;
          };
          const base = read('/tmp/mobile-package-base.json');
          const head = read('/tmp/mobile-package-head.json');
          const { isDeepStrictEqual } = await import('node:util');
          console.log(`mobile=${!isDeepStrictEqual(base, head)}`);
          NODE
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Dependencies deterministic installieren
        run: npm ci --ignore-scripts
      - name: Mobile OIDC und Universe Unit Tests
        run: node --test server/auth.test.mjs server/mobile-scorer.test.mjs server/scorer-proxy.test.mjs
      - name: MARKET Source-Admission und Top-400 Gate prüfen
        run: |
          set -euo pipefail
          mkdir -p security-reports
          node --input-type=module <<'NODE' | tee security-reports/mobile-top400-live.json
          import { loadUniverseForEvidence } from './server/mobile-scorer.mjs';
          import { MARKET_SOURCE_POLICY, admittedMarketSourcesFor } from './server/open-source-market-policy.mjs';
          const universe = await loadUniverseForEvidence({});
          const admittedSources = admittedMarketSourcesFor('mobileCryptoUniverse').length;
          const evidence = {
            schema: 'MOBILE_TOP400_RUNTIME@2',
            sourcePolicy: MARKET_SOURCE_POLICY.mode,
            admittedSources,
            status: universe.status,
            requested: universe.requested,
            count: universe.count,
            sources: universe.sources,
            rankMetrics: universe.rankMetrics,
            rightsScope: universe.rightsScope,
            uniqueSymbols: new Set(universe.assets.map(x => x.symbol)).size,
            firstRank: universe.assets[0]?.universeRank ?? null,
            lastRank: universe.assets.at(-1)?.universeRank ?? null,
          };
          console.log(JSON.stringify(evidence, null, 2));
          if (admittedSources === 0) {
            const failClosed =
              evidence.sourcePolicy === 'OPEN_SOURCE_AND_OPEN_DATA_ONLY' &&
              evidence.status === 'BLOCKED' &&
              evidence.count === 0 &&
              evidence.uniqueSymbols === 0 &&
              evidence.sources.length === 0 &&
              evidence.rightsScope === 'OPEN_SOURCE_OPEN_DATA_REQUIRED';
            if (!failClosed) process.exit(1);
          } else {
            const ranks = universe.assets.map(x => x.universeRank).filter(Number.isInteger);
            const monotonic = ranks.every((rank, index) => index === 0 || rank >= ranks[index - 1]);
            if (
              evidence.status !== 'READY' ||
              evidence.count !== 400 ||
              evidence.uniqueSymbols !== 400 ||
              evidence.firstRank !== 1 ||
              !monotonic ||
              evidence.lastRank < 400
            ) process.exit(1);
          }
          NODE
      - name: Kanonische Scorer Authority oder Fail-Closed Zustand verifizieren
        if: always()
        run: |
          set -euo pipefail
          mkdir -p security-reports
          admitted_sources="$(node --input-type=module -e "import { admittedMarketSourcesFor } from './server/open-source-market-policy.mjs'; console.log(admittedMarketSourcesFor('mobileCryptoUniverse').length)")"
          if [ "$admitted_sources" = "0" ]; then
            jq -n --arg admitted "$admitted_sources"               '{schema:"MOBILE_SCORER_ORIGIN_READBACK@3",mode:"FAIL_CLOSED",admittedSources:($admitted|tonumber),networkProbeExecuted:false,verified:true,reason:"NO_ADMITTED_MOBILE_CRYPTO_UNIVERSE_SOURCE"}'               | tee security-reports/mobile-scorer-origin.json
            exit 0
          fi
          probe() {
            local url="$1"
            curl --silent --show-error --location-trusted --max-redirs 0 --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 4 --max-time 20               -o /tmp/probe-body -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data '{}'
          }
          public_status="$(probe 'https://capital-ai.online/api/crypto/score' || true)"
          jq -n --arg admitted "$admitted_sources" --arg public "$public_status"             '{schema:"MOBILE_SCORER_ORIGIN_READBACK@4",mode:"ACTIVE_SOURCE_VALIDATION",topology:"PUBLIC_REVERSE_PROXY",admittedSources:($admitted|tonumber),networkProbeExecuted:true,publicOrigin:"https://capital-ai.online",publicStatus:$public,financePublicOriginProbeExecuted:false,verified:(["400","401","402","403","409","422","429"] | index($public) != null)}'             | tee security-reports/mobile-scorer-origin.json
          jq -e '.verified == true' security-reports/mobile-scorer-origin.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mobile-hardening-evidence
          retention-days: 14
          if-no-files-found: warn
          path: security-reports/*.json
