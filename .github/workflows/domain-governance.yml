name: Domain Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  validate-domain:
    name: Domain Governance
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - name: Validate branch and PR title
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          title_re='^\[CAPITAL-AI-(PRODUCT|MARKET|PLATFORM|TRUST|GROWTH)\] .+'
          branch_re='^capital-ai-(product|market|platform|trust|growth)/[a-z0-9][a-z0-9._-]*-[0-9]{8}$'

          if [[ "$PR_USER" == "dependabot[bot]" ]]; then
            [[ "$PR_TITLE" =~ $title_re ]] || {
              echo "Dependabot PR must carry a CAPITAL-AI domain prefix in its title."
              exit 1
            }
            exit 0
          fi

          [[ "$HEAD_REF" =~ $branch_re ]] || {
            echo "Branch must match capital-ai-<domain>/<purpose>-YYYYMMDD"
            exit 1
          }
          [[ "$PR_TITLE" =~ $title_re ]] || {
            echo "PR title must start with [CAPITAL-AI-PRODUCT|MARKET|PLATFORM|TRUST|GROWTH]"
            exit 1
          }
      - name: Validate merge-group identity (queue only)
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          MERGE_GROUP_ACTION: ${{ github.event.action }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          # Queued PRs must already pass the unchanged pull_request Domain Governance check.
          # This check validates only the GitHub-generated merge-group identity; no approval.
          [[ "$GITHUB_EVENT_NAME" == 'merge_group' ]]
          [[ "$GITHUB_REPOSITORY" == 'SvenKulessa/Capital-AI' ]]
          [[ "$MERGE_GROUP_ACTION" == 'checks_requested' ]]
          [[ "$MERGE_GROUP_BASE_REF" == 'refs/heads/main' ]]
          [[ "$MERGE_GROUP_HEAD_REF" =~ ^refs/heads/gh-readonly-queue/main/[^[:space:]]+$ ]]
          [[ "$MERGE_GROUP_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MERGE_GROUP_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MERGE_GROUP_BASE_SHA" != "$MERGE_GROUP_HEAD_SHA" ]]
          [[ "$GITHUB_REF" == "$MERGE_GROUP_HEAD_REF" ]]
          [[ "$GITHUB_SHA" == "$MERGE_GROUP_HEAD_SHA" ]]
          echo 'Domain Governance: merge-group identity verified; PR policy remains required.'
