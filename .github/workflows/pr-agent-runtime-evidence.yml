name: Optional PR-Agent Runtime Evidence

on:
  pull_request:
    paths:
      - deploy/pr-agent/Dockerfile.alpine
      - deploy/pr-agent/pyproject.toml
      - deploy/pr-agent/uv.lock
      - deploy/pr-agent/provenance.json
      - deploy/pr-agent/smoke.py
      - deploy/pr-agent/benchmark-entrypoint.py
      - .github/workflows/pr-agent-runtime-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Reviewer candidate build and scan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-PR-Agent/pr-agent
          ref: 8e5a9295973b24af4b70cafd0b660a230811ef9e
          path: reviewer-source
          persist-credentials: false

      - name: Resolve immutable Alpine Python base and stage identical inputs
        id: alpine
        shell: bash
        run: |
          set -euo pipefail

          docker pull --platform linux/amd64 python:3.14.7-alpine3.24
          python_base="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.14.7-alpine3.24)"
          [[ "$python_base" =~ ^python@sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Architecture}}' python:3.14.7-alpine3.24)" = "amd64"

          echo "python_base=$python_base" >> "$GITHUB_OUTPUT"
          mkdir -p reviewer-context reviewer-evidence

          test "$(git -C reviewer-source rev-parse HEAD)" = 8e5a9295973b24af4b70cafd0b660a230811ef9e

          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('deploy/pr-agent')
          evidence = json.loads((root / 'provenance.json').read_text())
          for name, expected in evidence['sha256'].items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          upstream = hashlib.sha256(pathlib.Path('reviewer-source/pyproject.toml').read_bytes()).hexdigest()
          assert upstream == evidence['sha256']['pyproject.toml'], upstream
          pathlib.Path('reviewer-evidence/input-identity.json').write_text(json.dumps({
              'reviewerSourceSha': '8e5a9295973b24af4b70cafd0b660a230811ef9e',
              'uvLockSha256': evidence['sha256']['uv.lock'],
              'pyprojectSha256': evidence['sha256']['pyproject.toml'],
              'licenseSha256': evidence['sha256']['UPSTREAM-LICENSE.txt'],
              'lockGenerator': evidence['lockGenerator'],
              'mode': 'primary-alpine-candidate'
          }, indent=2) + '\n')
          PY

          cp deploy/pr-agent/Dockerfile.alpine reviewer-context/Dockerfile
          cp deploy/pr-agent/pyproject.toml deploy/pr-agent/uv.lock deploy/pr-agent/UPSTREAM-LICENSE.txt deploy/pr-agent/benchmark-entrypoint.py deploy/pr-agent/smoke.py reviewer-context/
          cp -a reviewer-source/pr_agent reviewer-context/pr_agent
          printf '%s\n' "$python_base" > reviewer-evidence/python-base.txt

      - name: Build Alpine candidate from locked inputs
        env:
          PYTHON_BASE: ${{ steps.alpine.outputs.python_base }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create \
            --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c \
            --name reviewer-alpine-candidate \
            --use

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg "PYTHON_BASE=$PYTHON_BASE" \
            --load \
            --tag "capital-ai-reviewer:$GITHUB_SHA" \
            reviewer-context

      - name: Verify imports and offline runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          image="capital-ai-reviewer:$GITHUB_SHA"

          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.WorkingDir}}' "$image")" = "/bench"

          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /app/.venv/bin/python \
            "$image" \
            -c 'import pr_agent.cli, pr_agent.config_loader; from pr_agent.git_providers.plain_diff_provider import PlainDiffGitProvider; print("ALPINE_IMPORTS_PASS")' \
            | tee reviewer-evidence/import-smoke.txt

          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /app/.venv/bin/python \
            "$image" /app/smoke.py \
            | tee reviewer-evidence/offline-smoke.txt

          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint sh "$image" -euc \
            'python --version; cat /etc/alpine-release; test ! -e /usr/local/bin/pip; test ! -d /usr/local/lib/python3.14/ensurepip' \
            | tee reviewer-evidence/runtime-profile.txt

      - name: Bind exact Alpine image identity
        shell: bash
        run: |
          set -euo pipefail
          image="capital-ai-reviewer:$GITHUB_SHA"
          docker image inspect "$image" > reviewer-evidence/image-inspect.json
          docker save "$image" --output reviewer-evidence/runtime.tar
          chmod a+r reviewer-evidence/runtime.tar

          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$image")" \
          TESTED_SHA="$GITHUB_SHA" \
          python - <<'PY'
          import hashlib, json, os, pathlib
          archive = pathlib.Path('reviewer-evidence/runtime.tar')
          base = pathlib.Path('reviewer-evidence/python-base.txt').read_text().strip()
          pathlib.Path('reviewer-evidence/runtime-identity.json').write_text(json.dumps({
              'testedRepositorySha': os.environ['TESTED_SHA'],
              'reviewerSourceSha': '8e5a9295973b24af4b70cafd0b660a230811ef9e',
              'pythonBase': base,
              'localImageId': os.environ['IMAGE_ID'],
              'archiveSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'platform': 'linux/amd64',
              'distro': 'alpine-3.24',
              'role': 'primary-candidate',
              'mergeAuthority': False,
              'deployAuthority': False,
              'mode': 'candidate-only; no registry publish or deployment'
          }, indent=2) + '\n')
          PY

      - name: Trivy vulnerability, secret and CycloneDX SBOM evidence
        shell: bash
        run: |
          set -euo pipefail
          chmod a+rwx reviewer-evidence

          docker run --rm \
            -v "$PWD/reviewer-evidence:/reports" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /reports/runtime.tar \
            --scanners vuln,secret --ignorefile /dev/null \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output /reports/runtime-scan.json --exit-code 0

          node scripts/summarize-trivy.mjs reviewer-evidence/runtime-scan.json \
            > reviewer-evidence/runtime-scan.public.json

          docker run --rm \
            -v "$PWD/reviewer-evidence:/reports" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /reports/runtime.tar \
            --scanners vuln --format cyclonedx \
            --output /reports/runtime.sbom.cdx.json

          node scripts/summarize-trivy.mjs reviewer-evidence/runtime-scan.json --gate

      - name: Upload isolated Alpine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-agent-runtime-evidence-${{ github.sha }}
          path: |
            reviewer-evidence/input-identity.json
            reviewer-evidence/python-base.txt
            reviewer-evidence/import-smoke.txt
            reviewer-evidence/offline-smoke.txt
            reviewer-evidence/runtime-profile.txt
            reviewer-evidence/runtime-identity.json
            reviewer-evidence/runtime-scan.public.json
            reviewer-evidence/runtime.sbom.cdx.json
          if-no-files-found: warn
          retention-days: 7
