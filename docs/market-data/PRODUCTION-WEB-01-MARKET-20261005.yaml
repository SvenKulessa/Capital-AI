schemaVersion: "CAPITAL_AI_DOMAIN_WORK_PACKAGE@1"
id: "PRODUCTION-WEB-01-MARKET"
domain: "MARKET"
scope: "production-only"
priority: "high"
status: "ACTIVE_FAIL_CLOSED"
correlatedAt: "2026-10-05"
correlationBaseline:
  repository: "SvenKulessa/Capital-AI"
  mainSha: "52666468b758c9a295709069b12f53ca93e9bfc4"
  rootPolicy: "AGENTS.md@currentmain"
  roadmapSource: "src/data/roadmapData.ts"
  domainContract: "CAPITAL-AI-MARKET/PROJECT.md"

objective:
  productOutcome: "Kommerziell nutzbarer FinTech-Market-Screener mit evidenzgebundenem Scoring und getrenntem BYOK-Nutzerpfad."
  sharedMarketLane: "OPEN_SOURCE_OPEN_DATA_ADMITTED bleibt eine eigenständige produktive Lane und wird durch kommerzielle Providerrechte nicht erweitert."
  commercialLicensedDataLane: "Kommerziell lizenzierte Daten dürfen separat über COMMERCIAL_LICENSED_DATA geführt und Kunden über CAPITAL-AI als Drittanbieter angeboten werden, jedoch nur wenn Providervertrag, Entity, Dataset/Feeds, Attribution sowie ein ausdrückliches Reseller-/Agency-/Sublicense-/Pass-through-Recht für dieses Vertriebsmodell belegt sind."
  byokLane: "Nutzereigene Provider-Credentials bleiben user-private; sie erweitern weder öffentliche Anzeige-, Redistribution-, Shared-Cache- noch JetStream-Rechte."
  scoringOutcome: "Ein kanonischer Scoring-Pfad erzeugt nur aus zugelassenen, replay-verifizierbaren Inputs scoreEligible Ergebnisse; decisionEligible bleibt ein separates Gate."
  noExecutionClaim: true

claimValidation:
  providerClaims:
    requireImplementedAdapter: true
    requireRightsEvidence: true
  realtimeClaims:
    requireRealtimeEvidence: true
  scoringClaims:
    requireImplementedScoring: true
    respectScoreEligibility: true
    respectDecisionEligibility: true
  assetClaims:
    requireRealInstrumentManifest: true

providerPresentation:
  blockedProvider:
    selectableDescriptionAllowed: true
    productionReadyClaimAllowed: false

dataPresentation:
  demoDataAsProduction: false
  previewDataAsLive: false
  fallbackDataAsLive: false

websiteRequirements:
  - "Providerstatus nicht übertreiben"
  - "Datenrechte korrekt darstellen"
  - "Realtime nur bei echter Realtime-Evidence behaupten"
  - "Scoring-Fähigkeiten nur entsprechend CURRENT_MAIN kommunizieren"

marketInvariants:
  - "Provider-Auswahl ist niemals Source Admission."
  - "Open-Source-Adaptersoftware ist niemals automatisch Open-Data-Recht."
  - "COMMERCIAL_LICENSED_DATA ist von OPEN_SOURCE_OPEN_DATA_ADMITTED strikt getrennt und kann dessen Admission nicht implizit erfüllen."
  - "Kundenbezug über CAPITAL-AI als Drittanbieter setzt ein ausdrückliches Reseller-/Agency-/Sublicense-/Pass-through-Recht des Providers voraus; allgemeine Produktnutzungsrechte reichen nicht."
  - "marketQuotes und scoringPriceInput werden unabhängig zugelassen."
  - "scoreEligible und decisionEligible sind getrennte, fail-closed Gates."
  - "Demo-, Preview-, Fallback-, Research- und synthetische Benchmarkdaten werden niemals als produktive Evidence behandelt."
  - "Perpetuals zählen nur zusätzlich; ETF-, CFD-, Futures- oder Statistikserien ersetzen keine geforderte Spot-/Cash-Instrumentklasse."
  - "NATS-/Replay-Transport-Evidence erweitert keine Datenrechte."
  - "BYOK erweitert keine Rechte des gemeinsamen/public MARKET-Pfads."
  - "Fehlende, stale, konfliktäre oder nicht replay-verifizierbare Inputs erzeugen keinen neutralen Score."
  - "Kein Ranking ohne vergleichbare, zugelassene und ausreichend vollständige Score-Evidence."

