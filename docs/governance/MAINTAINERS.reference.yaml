    assigned_identity: null
    description: Historie und Evidence prüfen, ohne weitere Person zu behaupten
  technical_verifier:
    assigned_identity: null
    description: Tests, CI-Links und Supply-Chain-Evidence verifizieren
effective_permissions:
  source: current_AGENTS_and_actual_provider_IAM
  agent_default: existing_ACTIVE_CONSERVATIVE_with_scope_limits
  delegated_merge: unchanged
  production_and_credentials: existing_AGENTS_limits_apply
enforcement:
  this_file_changes_rights: false
  live_enforcement_status: NOT_PROVEN
