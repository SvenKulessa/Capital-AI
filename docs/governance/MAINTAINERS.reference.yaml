# REFERENCE ONLY – keine maschinenwirksame Policy, kein CODEOWNERS-Ersatz.
# Die aktuelle Root-AGENTS.md bleibt allein autorisierend; kein zusätzlicher Review.
version: 1
status: NON_AUTHORIZING
repository: SvenKulessa/Capital-AI
source_policy: AGENTS.md
owner:
